# Tip — nutrition_animale. ⚠️ Contenu CULTUREL (§8.4), sur l'animal et non sur le lecteur.
# Source : Beasley D. E., Koltz A. M., Lambert J. E., Fierer N., Dunn R. R. (2015), « The Evolution
# of Stomach Acidity and Its Relevance to the Human Microbiome », PLoS One,
# DOI 10.1371/journal.pone.0134116.
code: vautour-acidite
categorie: nutrition_animale
texte: >
  Les charognards obligatoires ont l'estomac le plus acide mesuré chez les vertébrés — pH moyen 1,3,
  jusqu'à 1,2 chez le vautour africain à dos blanc. Chez les herbivores, il monte à 5,5 ou plus.
  L'acidité fonctionne comme un filtre écologique contre ce qui voudrait coloniser l'intestin.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4519257/"
