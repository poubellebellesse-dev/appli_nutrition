# Tip — fait d'histoire des sciences, aucune portée santé.
# Source : Kurihara K. (2015), « Umami the Fifth Basic Taste: History of Studies on Receptor
# Mechanisms and Role as a Food Flavor », BioMed Research International, DOI 10.1155/2015/189402.
code: umami-ikeda
categorie: biologie_aliment
texte: >
  L'umami n'a été identifié qu'en 1908 : Kikunae Ikeda isole le glutamate du kombu et constate que
  son goût ne se ramène à aucun des quatre autres. Il faudra près d'un siècle pour que la
  reconnaissance internationale suive.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4515277/"
