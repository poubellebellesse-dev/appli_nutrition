# Tip — nutrition_animale. ⚠️ Contenu CULTUREL (§8.4), sur l'animal et non sur le lecteur.
# Source : Guo W., Chen Y., Wang C. et al. (2020), « The carnivorous digestive system and bamboo
# diet of giant pandas may shape their low gut bacterial diversity », Conservation Physiology,
# DOI 10.1093/conphys/coz104.
code: panda-carnivore
categorie: nutrition_animale
texte: >
  Le panda géant ne mange que du bambou avec un tube digestif de carnivore : droit, court et simple.
  Le transit y est trop rapide pour fermenter des fibres, et sa flore intestinale ressemble
  davantage à celle d'un carnivore qu'à celle d'un herbivore.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7066643/"
