code: crevette-astaxanthine
categorie: biologie_aliment
texte: >
  Une crevette vivante est grise parce que son pigment rouge, l'astaxanthine, est enfermé dans une
  protéine, la crustacyanine. La cuisson dénature cette protéine et libère le pigment : le rouge
  était là depuis le début.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8000252/"
