code: cacahuete-souterraine
categorie: biologie_aliment
texte: >
  La cacahuète est une légumineuse, pas une noix — et elle a une manie unique : sa fleur s'ouvre à
  l'air libre, puis un pédoncule s'enfonce dans le sol où la gousse se forme et mûrit à l'obscurité.
