# Tip — « Le saviez-vous ? » (§8.4 ARCHITECTURE). Fait botanique, aucune portée santé.
code: tomate-fruit
categorie: biologie_aliment
texte: >
  Botaniquement, la tomate est un fruit : elle se forme à partir de la fleur et contient
  les graines. C'est l'usage culinaire, salé, qui l'a rangée parmi les légumes.
