code: tomate-fruit
categorie: biologie_aliment
texte: >
  Botaniquement, la tomate est un fruit charnu : elle se développe à partir de l'ovaire de la fleur,
  dont la paroi devient la chair, et elle renferme les graines. C'est l'usage culinaire, salé, qui
  l'a rangée parmi les légumes.
