# Tip — fait de chimie alimentaire, aucune portée santé.
# Source : Zagórska J., Czernicka-Boś L., Kukula-Koch W., Szalak R., Koch W. (2022), « Impact of
# Thermal Processing on the Composition of Secondary Metabolites of Ginger Rhizome—A Review »,
# Foods 11(21):3484, DOI 10.3390/foods11213484.
#
# ⚠️ La comparaison « les shogaols sont deux fois plus piquants » circule beaucoup mais n'est PAS
# dans cette source, qui décrit la transformation sans quantifier le piquant. Non écrite.
code: gingembre-shogaol
categorie: biologie_aliment
texte: >
  Gingembre frais et gingembre séché n'ont pas la même chimie. Sous l'effet de la chaleur, les
  gingérols se déshydratent et deviennent des shogaols — des molécules différentes, et plus stables
  à la chaleur que celles dont elles proviennent.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9656818/"
