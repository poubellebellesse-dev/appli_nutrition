# Tip — fait de chimie alimentaire. Descriptif : décrit une transformation, ne prescrit pas une
# façon de cuisiner (§6.1).
# Source : Farooq M. A., Yu J. (2024), « Recent Advances in Physical Processing Techniques to
# Enhance the Resistant Starch Content in Foods: A Review », Foods 13(17):2770,
# DOI 10.3390/foods13172770.
code: amidon-refroidi
categorie: biologie_aliment
texte: >
  Refroidir un féculent cuit ne le ramène pas à son état de départ : une partie de son amidon se
  réorganise en amidon résistant, qui échappe à la digestion dans l'intestin grêle. Le même riz
  n'est plus tout à fait le même une fois froid.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11395633/"
