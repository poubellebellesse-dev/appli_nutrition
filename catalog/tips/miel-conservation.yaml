code: miel-conservation
categorie: biologie_aliment
texte: >
  La plupart des micro-organismes ne peuvent pas se développer dans le miel : sa teneur en eau est
  trop basse, la pression osmotique de son sucre trop forte, son acidité trop marquée. C'est cette
  combinaison, et non un ingrédient particulier, qui le conserve.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11214184/"
