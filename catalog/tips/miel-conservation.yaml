# Tip — fait de conservation, aucune portée santé.
code: miel-conservation
categorie: biologie_aliment
texte: >
  Le miel ne se périme pas. Sa très faible teneur en eau et son acidité empêchent les
  micro-organismes de s'y développer — on en a retrouvé encore comestible dans des
  tombes égyptiennes.
