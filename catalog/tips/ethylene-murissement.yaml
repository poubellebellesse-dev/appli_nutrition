# Tip — fait de physiologie végétale, aucune portée santé.
# Source : Ji Y., Wang A. (2021), « Recent Advances in Phytohormone Regulation of Apple-Fruit
# Ripening », Plants 10(10):2061, DOI 10.3390/plants10102061.
code: ethylene-murissement
categorie: biologie_aliment
texte: >
  L'éthylène, l'hormone qui déclenche le mûrissement de la pomme, de la banane ou de la tomate, est
  un gaz. Sa production est autocatalytique : elle s'entretient elle-même, ce qui explique qu'un
  fruit mûr accélère ses voisins.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8539861/"
