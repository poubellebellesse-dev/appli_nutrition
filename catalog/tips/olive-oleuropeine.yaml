# Tip — fait de transformation alimentaire, aucune portée santé.
# Source : Campus M., Değirmencioğlu N., Comunian R. (2018), « Technologies and Trends to Improve
# Table Olive Quality and Safety », Frontiers in Microbiology, DOI 10.3389/fmicb.2018.00617.
code: olive-oleuropeine
categorie: biologie_aliment
texte: >
  Une olive cueillie sur l'arbre est trop amère pour être mangée : c'est l'oleuropéine, son principal
  composé phénolique. Toutes les olives de table passent donc par une désamérisation — bain alcalin,
  saumure ou fermentation spontanée — qui hydrolyse la molécule.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5894437/"
