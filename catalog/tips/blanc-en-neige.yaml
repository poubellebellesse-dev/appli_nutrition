# Tip — fait de physico-chimie alimentaire, aucune portée santé.
# Source : Yu Z., Ma L., Liu B., Wang W., Shang Z., Dang H., Liu C. (2023), « Improvement of foaming
# properties of ovalbumin… », Ultrasonics Sonochemistry, DOI 10.1016/j.ultsonch.2023.106672.
code: blanc-en-neige
categorie: biologie_aliment
texte: >
  Monter un blanc en neige, c'est déplier des protéines. L'ovalbumine se précipite à la frontière
  entre l'eau et l'air, s'ouvre partiellement en exposant ses parties hydrophobes, et forme un film
  élastique qui emprisonne les bulles.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10656216/"
