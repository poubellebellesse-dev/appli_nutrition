# Tip — fait de microbiologie alimentaire, aucune portée santé.
# Source : Bartkiene E., Özogul F., Rocha J. M. (2022), « Bread Sourdough Lactic Acid Bacteria… »,
# Foods 11(3):452, DOI 10.3390/foods11030452.
code: levain-symbiose
categorie: biologie_aliment
texte: >
  Un levain, c'est de la farine et de l'eau — rien d'autre. Ce qui s'y installe vient de la farine
  et de l'air : des bactéries lactiques et des levures qui vivent en symbiose, et dont le
  métabolisme donne à la fois les acides organiques et le gaz carbonique.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8834576/"
