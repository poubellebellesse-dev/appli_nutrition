# Tip — fait de conservation. Descriptif, sans injonction (§6.1).
code: pomme-de-terre-verte
categorie: biologie_aliment
texte: >
  Une pomme de terre verdit à la lumière : c'est de la chlorophylle, accompagnée de
  solanine, un composé amer que la plante produit pour se défendre. D'où le stockage
  traditionnel à l'obscurité.
