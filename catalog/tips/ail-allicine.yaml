# Tip — fait de chimie alimentaire, aucune portée santé.
# Source : Lawson L. D., Hunsaker S. M. (2018), « Allicin Bioavailability and Bioequivalence from
# Garlic Supplements and Garlic Foods », Nutrients 10(7):812, DOI 10.3390/nu10070812.
code: ail-allicine
categorie: biologie_aliment
texte: >
  L'allicine, la molécule qui fait l'odeur de l'ail, n'existe pas dans la gousse intacte. Elle
  apparaît quand les cellules sont rompues : l'enzyme et son précurseur, jusque-là rangés
  séparément, se rencontrent. La réaction est complète en une trentaine de secondes.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6073756/"
