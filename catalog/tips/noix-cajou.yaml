code: noix-cajou
categorie: biologie_aliment
texte: >
  Chez l'anacardier, la noix de cajou est le fruit, et elle pend sous une « pomme » charnue qui n'en
  est pas un : ce pseudo-fruit est un pédoncule gonflé. Il pèse près de neuf fois la noix.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11311269/"
