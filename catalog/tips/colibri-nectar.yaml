# Tip — nutrition_animale. ⚠️ Contenu CULTUREL (§8.4), sur l'animal et non sur le lecteur.
# Source : Suarez R. K., Welch K. C. Jr (2017), « Sugar Metabolism in Hummingbirds and Nectar
# Bats », Nutrients 9(7):743, DOI 10.3390/nu9070743.
code: colibri-nectar
categorie: nutrition_animale
texte: >
  Le colibri brûle en vol stationnaire le sucre qu'il vient d'avaler : environ 95 % de son énergie
  vient du saccharose ingéré peu avant. Rapporté à la masse, son métabolisme aérobie est dix fois
  celui d'un athlète humain à son maximum.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5537857/"
