# Tip — fait de physiologie. Descriptif, aucune portée santé : le phénomène n'est pas pathologique.
# Source : Foot C. L., Fraser J. F. (2006), « Uroscopic rainbow: modern matula medicine »,
# Postgraduate Medical Journal, DOI 10.1136/pgmj.2005.037598.
code: betterave-urine
categorie: biologie_aliment
texte: >
  Chez 10 à 14 % des gens, la betterave colore l'urine en rose ou en rouge. Le phénomène porte un
  nom — la bétaturie — et vient des bétacyanines, les pigments du légume.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2596703/"
