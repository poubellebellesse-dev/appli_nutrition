code: congelation-cristaux
categorie: biologie_aliment
texte: >
  Ce n'est pas le froid qui ramollit un végétal décongelé, ce sont les cristaux de glace. Une
  congélation lente en forme de gros, entre les cellules, qui rompent les parois ; une congélation
  rapide en forme beaucoup de petits, bien moins destructeurs.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11344832/"
