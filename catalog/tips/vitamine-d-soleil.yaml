# Tip — nutrition_humaine. ⚠️ Descriptif : constate d'où vient la vitamine D, ne recommande NI
# exposition solaire NI supplémentation (§6.1) — deux sujets qui relèvent d'un avis médical.
# Source : Chen T. C. et al. (2007), « Factors that Influence the Cutaneous Synthesis and Dietary
# Sources of Vitamin D », Archives of Biochemistry and Biophysics, DOI 10.1016/j.abb.2006.12.017.
code: vitamine-d-soleil
categorie: nutrition_humaine
texte: >
  La vitamine D est la seule que le corps fabrique lui-même : la peau la synthétise sous l'effet des
  UVB. C'est la source principale chez la plupart des gens, car peu d'aliments en contiennent
  naturellement — les poissons gras étant les plus fournis.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2698590/"
