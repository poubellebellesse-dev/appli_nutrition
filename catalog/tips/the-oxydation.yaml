code: the-oxydation
categorie: biologie_aliment
texte: >
  Thé blanc, vert, jaune, oolong, noir et pu-erh viennent tous de la même plante, Camellia sinensis.
  Ce qui les sépare n'est pas la variété mais le degré d'oxydation des feuilles après la récolte.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8605308/"
