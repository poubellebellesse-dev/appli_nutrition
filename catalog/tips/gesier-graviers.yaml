# Source : Takasaki R., Kobayashi Y. (2020), « Effects of diet and gizzard muscularity on grit use
# in domestic chickens », PeerJ, DOI 10.7717/peerj.10277.
code: gesier-graviers
categorie: nutrition_animale
texte: >
  N'ayant pas de dents, beaucoup d'oiseaux avalent de petits graviers et les gardent dans le gésier,
  seul organe de broyage de leur tube digestif. Les gros morceaux y sont retenus jusqu'à être
  réduits — et les poules en avalent davantage quand leur ration est plus fibreuse.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7666813/"
