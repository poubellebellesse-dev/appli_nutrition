# Source : Drabik K., Karwowska M., Wengerska K., Próchniak T., Adamczuk A., Batkowska J. (2021),
# « The Variability of Quality Traits of Table Eggs and Eggshell Mineral Composition Depending on
# Hens' Breed and Eggshell Color », Animals 11(5):1204, DOI 10.3390/ani11051204.
code: oeuf-couleur-coquille
categorie: biologie_aliment
texte: >
  La couleur d'une coquille d'œuf dépend de la race de la poule, et de presque rien d'autre : la
  présence ou l'absence du pigment est génétique, l'alimentation et les conditions d'élevage n'y
  changent quasiment rien.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8146221/"
