# Tip — fait de physique alimentaire, aucune portée santé.
code: pain-rassis
categorie: biologie_aliment
texte: >
  Le pain ne rassit pas en séchant, mais en recristallisant : son amidon se réorganise.
  C'est pourquoi le réfrigérateur l'accélère, et pourquoi un passage au four le
  ramollit à nouveau.
