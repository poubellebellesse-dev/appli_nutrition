code: pain-rassis
categorie: biologie_aliment
texte: >
  Le pain ne rassit pas seulement en séchant : son amidon se réorganise en structures cristallines,
  ce qu'on appelle la rétrogradation. Le froid la favorise — à 4 °C, ces structures sont plus
  ordonnées qu'à température ambiante.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10888248/"
