# Tip — fait de physiologie sensorielle. Descriptif, aucune recommandation.
# Source : Pelchat M. L., Bykowski C., Duke F. F., Reed D. R. (2010), « Excretion and Perception of
# a Characteristic Odor in Urine after Asparagus Ingestion: a Psychophysical and Genetic Study »,
# Chemical Senses, DOI 10.1093/chemse/bjq081.
code: asperges-odeur
categorie: biologie_aliment
texte: >
  Après des asperges, l'urine prend une odeur soufrée — mais pas pour tout le monde, et deux
  caractères indépendants sont en jeu : produire l'odeur, et la percevoir. Dans cette étude, les
  deux n'étaient pas corrélés.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3002398/"
