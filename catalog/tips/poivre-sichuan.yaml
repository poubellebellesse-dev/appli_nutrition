# Tip — fait de neurophysiologie sensorielle, aucune portée santé.
# Source : Hagura N., Barber H., Haggard P. (2013), « Food vibrations: Asian spice sets lips
# trembling », Proceedings of the Royal Society B, DOI 10.1098/rspb.2013.1680.
code: poivre-sichuan
categorie: biologie_aliment
texte: >
  Le picotement du poivre de Sichuan n'est pas un goût : c'est du toucher. Des volontaires ont
  associé la sensation à une vibration mécanique de 50 Hz — la plage exacte des mécanorécepteurs
  qui détectent les vibrations légères.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3779329/"
