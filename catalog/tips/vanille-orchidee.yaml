code: vanille-orchidee
categorie: biologie_aliment
texte: >
  La vanille est la gousse d'une orchidée. Hors de son aire d'origine, la plante ne fructifie pas
  seule faute de pollinisateur : dans toutes les plantations du monde, chaque fleur est pollinisée
  à la main.
