code: flamant-canthaxanthine
categorie: nutrition_animale
texte: >
  Le rose du flamant tient à des caroténoïdes, dont la canthaxanthine représente plus de 60 %.
  L'oiseau les étale lui-même sur son plumage avec les sécrétions de sa glande uropygienne : sans ce
  maquillage, la couleur pâlit.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8525176/"
