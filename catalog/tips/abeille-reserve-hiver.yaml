# Source : Li C., Tang M., Li X., Zhou X. (2022), « Community Dynamics in Structure and Function of
# Honey Bee Gut Bacteria in Response to Winter Dietary Shift », mBio, DOI 10.1128/mbio.01131-22.
code: abeille-reserve-hiver
categorie: nutrition_animale
texte: >
  Le miel n'est pas fait pour nous : c'est la réserve d'hiver de la colonie. Les abeilles d'hiver
  restent confinées dans la ruche, sans sortir pour déféquer, et vivent essentiellement sur le miel
  stocké pendant la belle saison.
source_url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9600256/"
