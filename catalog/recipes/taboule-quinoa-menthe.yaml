id: taboule_quinoa_menthe
nom: "Taboulé de quinoa à la menthe"
description: >
  Du quinoa froid avec beaucoup de persil et de menthe, tomate, concombre et citron.
temps_prep_min: 20
temps_cuisson_min: 15
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: accompagnement
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.3
  leger_consistant: -0.2
  chaud_froid: -0.8
  texture: croquant

ingredients:
  - food_id: quinoa
    quantite_g: 200
    unite_affichage: "200 g"
    optionnel: false
  - food_id: persil
    quantite_g: 50
    unite_affichage: "1 gros bouquet"
    optionnel: false
  - food_id: menthe_fraiche
    quantite_g: 25
    unite_affichage: "1/2 bouquet"
    optionnel: false
  - food_id: tomate
    quantite_g: 300
    unite_affichage: "3 tomates"
    optionnel: false
  - food_id: concombre
    quantite_g: 200
    unite_affichage: "1/2 concombre"
    optionnel: false
  - food_id: citron
    quantite_g: 80
    unite_affichage: "1 gros citron"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 45
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: echalote
    quantite_g: 40
    unite_affichage: "1 échalote"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer le quinoa longuement à l'eau froide, puis le cuire dans deux fois son volume d'eau salée."
    lexicon_ids: []
    timer_s: 900
    timer_type: cuisson
  - ordre: 2
    texte: "L'étaler sur un plat pour le refroidir rapidement, sinon il continue de cuire et devient pâteux."
    lexicon_ids: []
    timer_s: 1200
    timer_type: repos
  - ordre: 3
    texte: "Ciseler le persil et la menthe très finement — dans un taboulé, les herbes ne sont pas une garniture mais un ingrédient principal."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Couper tomates et concombre en petits dés, émincer l'échalote."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Tout mélanger au quinoa froid avec l'huile, le jus de citron et le sel, puis laisser reposer au frais."
    lexicon_ids: []
    timer_s: 1800
    timer_type: repos

facettes:
  - facette: cuisine
    valeur: libanaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
