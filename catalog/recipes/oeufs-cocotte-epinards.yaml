id: oeufs_cocotte_epinards
nom: "Œufs cocotte aux épinards"
description: >
  Des œufs cuits au bain-marie sur un lit d'épinards à la crème, avec un peu de comté.
temps_prep_min: 10
temps_cuisson_min: 15
difficulte: 2
portions_base: 4
image_path: null
types_repas: [diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: -0.4
  leger_consistant: 0.0
  chaud_froid: 0.8
  texture: creme

ingredients:
  - food_id: oeuf
    quantite_g: 200
    unite_affichage: "4 œufs"
    optionnel: false
  - food_id: epinard
    quantite_g: 500
    unite_affichage: "500 g frais"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 100
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: comte_rape
    quantite_g: 60
    unite_affichage: "60 g râpé"
    optionnel: true
  - food_id: beurre_doux
    quantite_g: 20
    unite_affichage: "20 g"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 1
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 180 °C et mettre à chauffer un plat rempli d'eau, qui servira de bain-marie."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire tomber les épinards au beurre, les égoutter en pressant, puis les hacher et les saler."
    lexicon_ids: []
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Beurrer quatre ramequins, y répartir les épinards et une cuillère de crème."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Casser un œuf dans chaque ramequin, ajouter le comté et poser les ramequins dans le bain-marie."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Enfourner jusqu'à ce que le blanc soit pris et le jaune encore coulant — c'est une question de minutes, surveiller."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
