id: salade_lentilles_betterave_noix
nom: "Salade de lentilles vertes, betterave et noix"
origine: maison
description: >
  Des lentilles vertes tiédies mêlées à la betterave cuite, à l'échalote et aux noix, assaisonnées
  d'une vinaigrette à l'huile de noix et au vinaigre de cidre.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.3
  chaud_froid: -0.4
  texture: ferme

ingredients:
  - food_id: lentilles_vertes
    quantite_g: 250
    unite_affichage: "250 g"
    optionnel: false
  - food_id: betterave
    quantite_g: 400
    unite_affichage: "2 betteraves cuites"
    optionnel: false
  - food_id: noix
    quantite_g: 60
    unite_affichage: "une poignée"
    optionnel: false
  - food_id: echalote
    quantite_g: 50
    unite_affichage: "1 échalote"
    optionnel: false
  - food_id: huile_noix
    quantite_g: 25
    unite_affichage: "2 c. à soupe"
    optionnel: false
  - food_id: vinaigre_cidre
    quantite_g: 15
    unite_affichage: "1 c. à soupe"
    optionnel: false
  - food_id: persil
    quantite_g: 10
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Cuire les lentilles vertes jusqu'à ce qu'elles soient tendres, puis les égoutter."
    lexicon_ids: [egoutter]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 2
    texte: "Tailler la betterave cuite en dés et émincer l'échalote."
    lexicon_ids: [tailler_des, emincer]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Fouetter l'huile de noix et le vinaigre de cidre pour la vinaigrette."
    lexicon_ids: [fouetter]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Mélanger les lentilles tièdes, la betterave, l'échalote et la vinaigrette."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Parsemer de noix concassées et de persil ciselé avant de servir."
    lexicon_ids: [parsemer, concasser, ciseler]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
