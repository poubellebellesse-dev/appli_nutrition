id: pancakes_sarrasin_myrtilles
nom: "Pancakes au sarrasin et aux myrtilles"
origine: maison
description: >
  Des pancakes épais où le sarrasin remplace une partie de la farine de blé, cuits à la
  poêle avec les myrtilles posées sur la pâte encore crue.
temps_prep_min: 10
temps_cuisson_min: 15
difficulte: 2
portions_base: 4
image_path: null
types_repas: [petit_dejeuner, gouter]
service: dessert
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: 0.5
  leger_consistant: 0.4
  chaud_froid: 0.7
  texture: moelleux

ingredients:
  - food_id: farine_sarrasin
    quantite_g: 100
    unite_affichage: "100 g"
    optionnel: false
  - food_id: farine_ble
    quantite_g: 100
    unite_affichage: "100 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 120
    unite_affichage: "2 œufs"
    optionnel: false
  - food_id: lait_demi_ecreme
    quantite_g: 280
    unite_affichage: "28 cl"
    optionnel: false
  - food_id: levure_chimique
    quantite_g: 8
    unite_affichage: "1 sachet"
    optionnel: false
  - food_id: sucre_roux
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: myrtille
    quantite_g: 150
    unite_affichage: "1 barquette"
    optionnel: false
  - food_id: huile_tournesol
    quantite_g: 15
    unite_affichage: "1 cuillère à soupe"
    optionnel: false
  - food_id: sirop_erable
    quantite_g: 40
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Mélanger les deux farines, la levure, le sucre et le sel dans un saladier."
    lexicon_ids: [incorporer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Battre les œufs avec le lait, puis les verser d'un coup sur les farines en fouettant."
    lexicon_ids: [battre, fouetter]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Laisser la pâte reposer le temps que le sarrasin boive le liquide."
    lexicon_ids: [reserver]
    timer_s: 900
    timer_type: repos
  - ordre: 4
    texte: "Huiler légèrement la poêle et verser une petite louche de pâte par pancake."
    lexicon_ids: [badigeonner]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Poser quelques myrtilles sur la pâte encore liquide, attendre que des bulles crèvent en surface, puis retourner."
    lexicon_ids: [poeler]
    timer_s: 900
    timer_type: cuisson
  - ordre: 6
    texte: "Empiler les pancakes au fur et à mesure et servir avec le sirop d'érable."
    lexicon_ids: [dresser]
    timer_s: null
    timer_type: null
  - ordre: 7
    texte: "Les myrtilles se posent sur la pâte, elles ne se mélangent pas dedans : remuées, elles teintent tout en gris."
    lexicon_ids: []
    timer_s: null
    timer_type: null
    nature: avertissement

equipements:
  - code: poele
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: saladier
    niveau: informatif
  - code: fouet
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: gourmand
