id: escalope_dinde_champignons
nom: "Escalopes de dinde aux champignons"
origine: maison
description: >
  Des escalopes de dinde poêlées, nappées d'une sauce aux champignons de Paris et à la crème.
temps_prep_min: 10
temps_cuisson_min: 20
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: 0.5
  chaud_froid: 0.8
  texture: creme

ingredients:
  - food_id: escalope_dinde
    quantite_g: 500
    unite_affichage: "4 escalopes"
    optionnel: false
  - food_id: champignon_paris
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 100
    unite_affichage: "10 cl"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 20
    unite_affichage: "20 g"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false
  - food_id: persil
    quantite_g: 10
    unite_affichage: "quelques brins"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Émincer l'oignon et les champignons."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Saisir les escalopes dans le beurre chaud, deux minutes par face, puis les réserver."
    lexicon_ids: [saisir, reserver]
    timer_s: 240
    timer_type: cuisson
  - ordre: 3
    texte: "Faire revenir l'oignon puis les champignons dans la même poêle jusqu'à évaporation de leur eau."
    lexicon_ids: [revenir]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter la crème, saler, remettre les escalopes et laisser mijoter à couvert — les deux minutes par face ne suffisent pas, c'est ici que la dinde finit de cuire à cœur et cesse d'être rosée. Parsemer de persil."
    lexicon_ids: [mijoter, parsemer]
    timer_s: 360
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: omnivore
  - facette: style
    valeur: quotidien

sources:
  - type: reference
    titre: "Guide de bonnes pratiques d'hygiène — Consommateurs (ministère de l'Agriculture)"
    url: "https://agriculture.gouv.fr/sites/default/files/documents/pdf/GBPH_Consommateurs_5958_cle8bb1ad.pdf"
    consulte_le: "2026-08-02"
  - type: reference
    titre: "Cooking your food — Food Standards Agency (GOV.UK)"
    url: "https://www.gov.uk/government/publications/cooking-your-food/cooking-your-food"
    consulte_le: "2026-08-02"
