id: pommes_de_terre_accordeon
nom: "Pommes de terre accordéon"
origine: maison
description: >
  Des pommes de terre entaillées en tranches fines sans être coupées jusqu'au bout : à la
  cuisson, elles s'ouvrent en éventail et chaque lamelle croustille.
temps_prep_min: 15
temps_cuisson_min: 55
difficulte: 2
portions_base: 4
image_path: /catalog/images/pommes-de-terre-accordeon.avif
types_repas: [dejeuner, diner]
service: accompagnement
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: -0.7
  leger_consistant: 0.5
  chaud_froid: 0.9
  texture: croquant

ingredients:
  - food_id: pomme_de_terre
    quantite_g: 800
    unite_affichage: "8 pommes de terre moyennes"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 50
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: ail
    quantite_g: 12
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: romarin_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 1
    unite_affichage: "1 tour de moulin"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 200 °C et laver les pommes de terre sans les peler."
    lexicon_ids: [prechauffer, rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Poser chaque pomme de terre entre deux baguettes ou deux cuillères en bois : la lame s'arrête dessus et ne traverse jamais."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Entailler en tranches de trois millimètres sur toute la longueur, sans détacher la base."
    lexicon_ids: [detailler]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Mélanger l'huile avec l'ail haché et le romarin, puis badigeonner les pommes de terre en insistant entre les lamelles."
    lexicon_ids: [hacher, badigeonner]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Enfourner à découvert, en badigeonnant de nouveau à mi-cuisson quand les tranches commencent à s'écarter."
    lexicon_ids: [enfourner, rotir, badigeonner]
    timer_s: 3300
    timer_type: cuisson
  - ordre: 6
    texte: "Saler et poivrer à la sortie du four, quand la surface est encore grasse et accroche l'assaisonnement."
    lexicon_ids: [assaisonner]
    timer_s: null
    timer_type: null

equipements:
  - code: four
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: requis
  - code: pinceau
    niveau: informatif
  - code: plat_a_four
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: scandinave
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: loufoque
