id: salade_orange_olives
nom: "Salade d'oranges aux olives noires"
origine: maison
description: >
  Des rondelles d'orange pelées à vif, olives noires, oignon rouge et cumin.
temps_prep_min: 15
temps_cuisson_min: 0
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: 0.4
  leger_consistant: -0.7
  chaud_froid: -0.8
  texture: fondant

ingredients:
  - food_id: orange
    quantite_g: 700
    unite_affichage: "5 oranges"
    optionnel: false
  - food_id: olive_noire
    quantite_g: 80
    unite_affichage: "une poignée"
    optionnel: false
  - food_id: oignon
    quantite_g: 80
    unite_affichage: "1/2 oignon rouge"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: coriandre_fraiche
    quantite_g: 10
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 3
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Peler les oranges À VIF : couper les deux extrémités, puis suivre la courbe du fruit au couteau pour retirer toute la peau blanche."
    lexicon_ids: [eplucher]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les détailler en rondelles d'un demi-centimètre, en récupérant le jus qui s'écoule."
    lexicon_ids: [detailler]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Émincer l'oignon très finement et le laisser dégorger quelques minutes dans l'eau froide."
    lexicon_ids: [emincer]
    timer_s: 600
    timer_type: repos
  - ordre: 4
    texte: "Écraser les graines de cumin au mortier et les mêler à l'huile et au jus récupéré."
    lexicon_ids: [ecraser]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Dresser les rondelles en rosace, parsemer d'oignon et d'olives, arroser et saler légèrement."
    lexicon_ids: [arroser, parsemer, dresser]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: maghrebine
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
