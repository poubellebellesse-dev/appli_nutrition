id: courgettes_farcies_riz_feta
nom: "Courgettes farcies au riz et à la feta"
origine: maison
description: >
  Des courgettes évidées, garnies de riz, feta et menthe, cuites au four sur des tomates.
temps_prep_min: 30
temps_cuisson_min: 40
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.4
  chaud_froid: 0.8
  texture: fondant

ingredients:
  - food_id: courgette
    quantite_g: 1000
    unite_affichage: "4 grosses courgettes"
    optionnel: false
  - food_id: riz_blanc
    quantite_g: 150
    unite_affichage: "150 g"
    optionnel: false
  - food_id: feta
    quantite_g: 200
    unite_affichage: "200 g"
    optionnel: false
  - food_id: tomate
    quantite_g: 300
    unite_affichage: "3 tomates"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: menthe_fraiche
    quantite_g: 15
    unite_affichage: "quelques feuilles"
    optionnel: false
  - food_id: pignon_pin
    quantite_g: 40
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: huile_olive
    quantite_g: 35
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Couper les courgettes en deux dans la longueur et les évider en gardant un centimètre de chair."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Cuire le riz à moitié seulement : il finira de gonfler dans les courgettes."
    lexicon_ids: []
    timer_s: 480
    timer_type: cuisson
  - ordre: 3
    texte: "Faire revenir l'oignon émincé et la chair de courgette hachée, jusqu'à évaporation de l'eau."
    lexicon_ids: [emincer, hacher, revenir]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Hors du feu, mêler le riz, la feta émiettée, la menthe et les pignons. Saler très peu, la feta sale déjà."
    lexicon_ids: [emietter]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Garnir les demi-courgettes, les poser sur un lit de tomates concassées, arroser d'huile et enfourner à 190 °C."
    lexicon_ids: [concasser, arroser, enfourner]
    timer_s: 2400
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: grecque
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
