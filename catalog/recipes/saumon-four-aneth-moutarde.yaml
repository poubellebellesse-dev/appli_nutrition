id: saumon_four_aneth_moutarde
nom: "Pavé de saumon au four, moutarde et aneth"
description: >
  Des pavés de saumon nappés de moutarde et de crème à l'aneth, cuits au four.
temps_prep_min: 10
temps_cuisson_min: 18
difficulte: 1
portions_base: 4
image_path: null
types_repas: [diner]
