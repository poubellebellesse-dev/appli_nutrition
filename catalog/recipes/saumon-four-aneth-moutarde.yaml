etapes:
  - ordre: 1
    texte: "Préchauffer le four à 190 °C et poser les pavés dans un plat, peau vers le bas."
    lexicon_ids: [prechauffer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Mélanger la moutarde, la crème, l'aneth ciselé et le sel."
    lexicon_ids: [ciseler]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Napper généreusement chaque pavé de ce mélange."
    lexicon_ids: [napper]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Enfourner sans dépasser le temps : le saumon doit rester légèrement rosé au centre."
    lexicon_ids: [enfourner]
    timer_s: 1080
    timer_type: cuisson
  - ordre: 5
    texte: "Servir avec des quartiers de citron et un tour de poivre."
    lexicon_ids: []
    timer_s: null
