id: lotte_americaine
nom: "Lotte à l'américaine"
origine: maison
description: >
  Des médaillons de lotte mijotés dans une sauce tomate au vin blanc et au cognac.
temps_prep_min: 20
temps_cuisson_min: 30
difficulte: 3
portions_base: 4
image_path: null
types_repas: [diner]
service: plat
saison_mois: []
envergure: fete
conservation_jours: 1
axes:
  sucre_sale: -0.5
  leger_consistant: 0.3
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: lotte
    quantite_g: 800
    unite_affichage: "800 g de queue"
    optionnel: false
  - food_id: tomate
    quantite_g: 500
    unite_affichage: "5 tomates"
    optionnel: false
  - food_id: concentre_tomate
    quantite_g: 25
    unite_affichage: "1 cuillère à soupe"
    optionnel: false
  - food_id: vin_blanc_cuisine
    quantite_g: 200
    unite_affichage: "20 cl"
    optionnel: false
  - food_id: cognac
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: echalote
    quantite_g: 80
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 80
    unite_affichage: "4 cuillères à soupe"
    optionnel: true
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Retirer la membrane grise de la lotte, qui se rétracte à la cuisson, puis couper la chair en médaillons."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Colorer les médaillons dans l'huile chaude une minute par face, puis les réserver."
    lexicon_ids: [reserver]
    timer_s: 180
    timer_type: cuisson
  - ordre: 3
    texte: "Faire suer les échalotes et l'ail émincés, verser le cognac et laisser l'alcool s'évaporer."
    lexicon_ids: [emincer, suer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 4
    texte: "Déglacer au vin blanc, ajouter les tomates en dés et le concentré, saler, puis laisser réduire à découvert."
    lexicon_ids: [reduire, deglacer, tailler_des]
    timer_s: 900
    timer_type: cuisson
  - ordre: 5
    texte: "Remettre les médaillons dans la sauce pour les dernières minutes seulement, jusqu'à ce que la chair soit ferme et opaque à cœur, incorporer la crème hors du feu."
    lexicon_ids: [incorporer]
    timer_s: 420
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: pescetarien
  - facette: occasion
    valeur: repas_de_fete
  - facette: style
    valeur: convivial

sources:
  - type: reference
    titre: "Cooking your food — Food Standards Agency (GOV.UK)"
    url: "https://www.gov.uk/government/publications/cooking-your-food/cooking-your-food"
    consulte_le: "2026-08-02"
