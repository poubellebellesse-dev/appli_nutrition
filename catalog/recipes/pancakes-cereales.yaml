id: pancakes_cereales
nom: "Céréales de mini-pancakes"
origine: maison
description: >
  Des pancakes de la taille d'une pièce, cuits par dizaines à la poêle, servis dans un bol
  avec du lait froid comme des céréales.
temps_prep_min: 10
temps_cuisson_min: 20
difficulte: 2
portions_base: 4
image_path: null
types_repas: [petit_dejeuner, gouter]
service: dessert
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: 0.5
  leger_consistant: 0.2
  chaud_froid: -0.2
  texture: moelleux

ingredients:
  - food_id: farine_ble
    quantite_g: 180
    unite_affichage: "180 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 60
    unite_affichage: "1 œuf"
    optionnel: false
  - food_id: lait_demi_ecreme
    quantite_g: 400
    unite_affichage: "40 cl, dont 20 pour servir"
    optionnel: false
  - food_id: levure_chimique
    quantite_g: 8
    unite_affichage: "1 sachet"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 20
    unite_affichage: "1 noix"
    optionnel: false
  - food_id: sirop_erable
    quantite_g: 40
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Fouetter la farine, la levure, le sucre et le sel avec l'œuf et la moitié du lait, jusqu'à obtenir une pâte lisse et coulante."
    lexicon_ids: [fouetter]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Verser la pâte dans une bouteille souple ou une poche : c'est le seul moyen de faire des ronds réguliers de deux centimètres."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Beurrer la poêle et déposer les mini-pancakes en quinconce, sans qu'ils se touchent."
    lexicon_ids: [badigeonner]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Les retourner un par un dès que le dessus n'est plus brillant, puis recommencer jusqu'à épuisement de la pâte."
    lexicon_ids: [poeler, dorer]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 5
    texte: "Répartir dans des bols, verser le lait froid restant et arroser de sirop d'érable."
    lexicon_ids: [dresser, arroser]
    timer_s: null
    timer_type: null
  - ordre: 6
    texte: "Le lait se verse à table, jamais à l'avance : les pancakes le boivent en une minute et s'affaissent."
    lexicon_ids: []
    timer_s: null
    timer_type: null
    nature: avertissement

equipements:
  - code: poele
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: saladier
    niveau: informatif
  - code: fouet
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: loufoque
