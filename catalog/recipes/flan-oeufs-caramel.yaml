id: flan_oeufs_caramel
nom: "Flan aux œufs et caramel"
origine: maison
description: >
  Un appareil œufs-lait cuit au bain-marie sur un caramel blond, servi bien froid.
temps_prep_min: 20
temps_cuisson_min: 50
difficulte: 3
portions_base: 6
image_path: /catalog/images/flan-oeufs-caramel.avif
types_repas: [gouter]
service: dessert
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 3
axes:
  sucre_sale: 0.9
  leger_consistant: 0.2
  chaud_froid: -0.7
  texture: creme

ingredients:
  - food_id: lait_entier
    quantite_g: 750
    unite_affichage: "75 cl"
    optionnel: false
  - food_id: oeuf
    quantite_g: 300
    unite_affichage: "6 œufs"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 180
    unite_affichage: "180 g (dont 100 pour le caramel)"
    optionnel: false
  - food_id: cannelle
    quantite_g: 1
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Faire fondre 100 g de sucre à sec dans une casserole, sans remuer, jusqu'à une couleur blonde."
    lexicon_ids: []
    timer_s: 420
    timer_type: cuisson
  - ordre: 2
    texte: "Verser aussitôt le caramel dans le moule et l'incliner pour en tapisser le fond — il fige en quelques secondes."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire chauffer le lait sans le faire bouillir, pendant qu'on fouette les œufs avec le reste du sucre."
    lexicon_ids: []
    timer_s: 300
    timer_type: cuisson
  - ordre: 4
    texte: "Verser le lait chaud EN FILET sur les œufs en fouettant sans arrêt, sinon ils coagulent en grumeaux."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Passer au tamis, verser sur le caramel, cuire au bain-marie à 160 °C, puis refroidir plusieurs heures avant de démouler."
    lexicon_ids: [bain_marie, chinois]
    timer_s: 3000
    timer_type: cuisson

equipements:
  - code: four
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: chinois
    niveau: informatif
  - code: fouet
    niveau: informatif
  - code: casserole
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: convivial
