id: quinoa_haricots_rouges_mais
nom: "Quinoa aux haricots rouges, maïs et poivrons"
description: >
  Un plat complet aux saveurs mexicaines, sans cuisson longue.
temps_prep_min: 15
temps_cuisson_min: 25
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.6
  leger_consistant: 0.5
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: quinoa
    quantite_g: 320
    unite_affichage: "320 g"
    optionnel: false
  - food_id: haricot_rouge
    quantite_g: 300
    unite_affichage: "1 boîte égouttée"
    optionnel: false
  - food_id: mais_doux
    quantite_g: 150
    unite_affichage: "150 g"
    optionnel: false
  - food_id: poivron_rouge
    quantite_g: 150
    unite_affichage: "1 poivron"
    optionnel: false
  - food_id: oignon
    quantite_g: 80
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: paprika
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: citron
    quantite_g: 20
    unite_affichage: "1/2 citron"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer et cuire le quinoa à l'eau bouillante."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire revenir l'oignon et le poivron en dés avec les épices."
    lexicon_ids: [revenir, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Ajouter les haricots rouges et le maïs, réchauffer."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Mélanger au quinoa et arroser de jus de citron."
    lexicon_ids: [arroser]
    timer_s: null
    timer_type: null

facettes:
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: reconfortant
