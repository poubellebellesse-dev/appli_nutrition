id: granola_maison
nom: "Granola maison aux noix et au miel"
description: >
  Des flocons d'avoine, noisettes et amandes enrobés de miel et grillés au four.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 8
image_path: null
types_repas: [petit_dejeuner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: 0.7
  leger_consistant: 0.4
  chaud_froid: -0.3
  texture: croquant

ingredients:
  - food_id: flocons_avoine
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: noisette
    quantite_g: 100
    unite_affichage: "100 g"
    optionnel: false
  - food_id: amande_effilee
    quantite_g: 80
    unite_affichage: "80 g"
    optionnel: false
  - food_id: graine_tournesol
    quantite_g: 60
    unite_affichage: "60 g"
    optionnel: true
  - food_id: miel
    quantite_g: 100
    unite_affichage: "100 g"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 50
    unite_affichage: "5 cuillères à soupe"
    optionnel: false
  - food_id: cannelle
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 150 °C — une chaleur douce, le miel brûlerait plus haut."
    lexicon_ids: [prechauffer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Concasser grossièrement les noisettes et mêler tous les ingrédients secs."
    lexicon_ids: [concasser]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire tiédir le miel avec l'huile pour qu'il se répande, puis verser sur le mélange et remuer."
    lexicon_ids: []
    timer_s: 120
    timer_type: cuisson
  - ordre: 4
    texte: "Étaler sur une plaque et enfourner en remuant toutes les dix minutes, pour que tout dore également."
    lexicon_ids: [enfourner, etaler]
    timer_s: 1800
    timer_type: cuisson
  - ordre: 5
    texte: "Laisser refroidir SANS TOUCHER : c'est en refroidissant que le granola durcit et forme des grumeaux."
    lexicon_ids: []
    timer_s: 1800
    timer_type: repos

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
