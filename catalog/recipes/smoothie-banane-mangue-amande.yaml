id: smoothie_banane_mangue_amande
nom: "Smoothie banane-mangue à la boisson d'amande"
origine: maison
description: >
  Un smoothie épais, sans sucre ajouté, la mangue suffit.
temps_prep_min: 5
temps_cuisson_min: 5
difficulte: 1
portions_base: 1
image_path: /catalog/images/smoothie-banane-mangue-amande.avif
types_repas: [petit_dejeuner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: -0.6
  leger_consistant: 0.5
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: banane
    quantite_g: 120
    unite_affichage: "1 banane"
    optionnel: false
  - food_id: mangue
    quantite_g: 150
    unite_affichage: "1/2 mangue"
    optionnel: false
  - food_id: boisson_amande
    quantite_g: 200
    unite_affichage: "20 cl"
    optionnel: false
  - food_id: flocons_avoine
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: amande_effilee
    quantite_g: 10
    unite_affichage: "1 cuillère à soupe"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Éplucher la banane et la mangue, les couper en morceaux."
    lexicon_ids: [eplucher]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Mixer avec la boisson à l'amande jusqu'à obtenir une texture lisse."
    lexicon_ids: [mixer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
