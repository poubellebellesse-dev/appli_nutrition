id: artichauts_vinaigrette
nom: "Artichauts à la vinaigrette"
description: >
  Des artichauts entiers cuits à l'eau, effeuillés et trempés dans une vinaigrette moutardée.
temps_prep_min: 10
temps_cuisson_min: 40
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: entree
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.5
  leger_consistant: -0.6
  chaud_froid: -0.2
  texture: fondant

ingredients:
  - food_id: artichaut
    quantite_g: 1200
    unite_affichage: "4 artichauts"
    optionnel: false
  - food_id: moutarde_dijon
    quantite_g: 20
    unite_affichage: "1 cuillère à soupe"
    optionnel: false
  - food_id: vinaigre_vin_rouge
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 60
    unite_affichage: "6 cuillères à soupe"
    optionnel: false
  - food_id: echalote
    quantite_g: 40
    unite_affichage: "1 échalote"
    optionnel: true
  - food_id: citron
    quantite_g: 40
    unite_affichage: "1/2 citron"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 6
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Casser la queue des artichauts à la main plutôt que la couper — les fibres dures viennent avec."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les plonger dans une grande casserole d'eau bouillante salée et citronnée, tête en bas."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Cuire jusqu'à ce qu'une feuille de la base se détache sans résistance."
    lexicon_ids: []
    timer_s: 2400
    timer_type: cuisson
  - ordre: 4
    texte: "Les égoutter tête en bas pour évacuer l'eau retenue entre les feuilles."
    lexicon_ids: []
    timer_s: 600
    timer_type: repos
  - ordre: 5
    texte: "Délayer la moutarde avec le vinaigre et le sel, monter à l'huile, ajouter l'échalote émincée et servir à part."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
