id: porc_poitrine_lentilles
nom: "Lentilles à la poitrine de porc"
origine: maison
description: >
  Des lentilles vertes mijotées avec de la poitrine de porc, carotte, oignon et laurier.
temps_prep_min: 15
temps_cuisson_min: 50
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.5
  leger_consistant: 0.8
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: lentilles_vertes
    quantite_g: 350
    unite_affichage: "350 g"
    optionnel: false
  - food_id: porc_poitrine
    quantite_g: 300
    unite_affichage: "300 g"
    optionnel: false
  - food_id: carotte
    quantite_g: 250
    unite_affichage: "2 carottes"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: laurier
    quantite_g: 1
    unite_affichage: "1 feuille"
    optionnel: false
  - food_id: thym_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: true
  - food_id: moutarde_dijon
    quantite_g: 15
    unite_affichage: "1 cuillère à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Faire revenir la poitrine coupée en lardons dans une cocotte, sans matière grasse, jusqu'à ce qu'elle rende son gras."
    lexicon_ids: [revenir]
    timer_s: 480
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter l'oignon émincé et la carotte en rondelles, laisser blondir."
    lexicon_ids: [emincer]
    timer_s: 420
    timer_type: cuisson
  - ordre: 3
    texte: "Verser les lentilles rincées, le laurier et le thym, couvrir d'eau de trois centimètres."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Laisser mijoter à découvert sans saler — le sel en début de cuisson durcit la peau des lentilles."
    lexicon_ids: [mijoter]
    timer_s: 2100
    timer_type: cuisson
  - ordre: 5
    texte: "Saler en fin de cuisson, retirer le laurier et lier d'une cuillère de moutarde hors du feu."
    lexicon_ids: []
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: passoire
    niveau: informatif
  - code: cocotte
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: omnivore
  - facette: style
    valeur: quotidien
