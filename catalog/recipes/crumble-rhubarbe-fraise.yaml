id: crumble_rhubarbe_fraise
nom: "Crumble rhubarbe-fraise"
origine: maison
description: >
  De la rhubarbe acidulée et des fraises sous une pâte sableuse aux flocons d'avoine.
temps_prep_min: 25
temps_cuisson_min: 40
difficulte: 1
portions_base: 6
image_path: /catalog/images/crumble-rhubarbe-fraise.avif
types_repas: [gouter]
service: dessert
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: 0.8
  leger_consistant: 0.5
  chaud_froid: 0.6
  texture: croquant

ingredients:
  - food_id: rhubarbe
    quantite_g: 600
    unite_affichage: "600 g de tiges"
    optionnel: false
  - food_id: fraise
    quantite_g: 300
    unite_affichage: "300 g"
    optionnel: false
  - food_id: farine_ble
    quantite_g: 120
    unite_affichage: "120 g"
    optionnel: false
  - food_id: flocons_avoine
    quantite_g: 60
    unite_affichage: "60 g"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 120
    unite_affichage: "120 g froid"
    optionnel: false
  - food_id: sucre_roux
    quantite_g: 120
    unite_affichage: "120 g"
    optionnel: false
  - food_id: amande_effilee
    quantite_g: 40
    unite_affichage: "40 g"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Couper la rhubarbe en tronçons, la saupoudrer d'un tiers du sucre et la laisser dégorger."
    lexicon_ids: [saupoudrer]
    timer_s: 2700
    timer_type: repos
  - ordre: 2
    texte: "Jeter le jus rendu — c'est lui qui noierait le crumble — puis mêler la rhubarbe aux fraises équeutées."
    lexicon_ids: [equeuter]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Mélanger farine, flocons d'avoine, amandes et le reste du sucre."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Ajouter le beurre FROID en dés et sabler du bout des doigts, sans former de pâte."
    lexicon_ids: [tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Répartir les fruits dans un plat, couvrir de pâte sans tasser, et enfourner à 180 °C jusqu'à ce que le jus bouillonne sur les bords."
    lexicon_ids: [enfourner]
    timer_s: 2400
    timer_type: cuisson

equipements:
  - code: four
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: saladier
    niveau: informatif
  - code: plat_a_four
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: britannique
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: convivial
