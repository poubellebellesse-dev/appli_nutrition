id: soupe_tomate_basilic
nom: "Soupe de tomates au basilic"
description: >
  Des tomates mijotées avec oignon et ail, mixées et parfumées au basilic frais.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [diner]
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.2
  leger_consistant: -0.5
  chaud_froid: 0.8
  texture: liquide

ingredients:
  - food_id: tomate
    quantite_g: 1200
    unite_affichage: "12 tomates"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: ail
    quantite_g: 12
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: basilic_frais
    quantite_g: 25
    unite_affichage: "1 bouquet"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 60
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: sucre_blanc
    quantite_g: 5
    unite_affichage: "1 pincée"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer l'oignon et l'ail, les faire fondre dans l'huile sans coloration."
    lexicon_ids: [emincer]
    timer_s: 480
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter les tomates coupées en quartiers, saler et couvrir."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Laisser compoter jusqu'à ce que les peaux se détachent et que le jus soit rendu."
    lexicon_ids: []
    timer_s: 1500
    timer_type: cuisson
  - ordre: 4
    texte: "Mixer, puis passer au tamis si l'on veut retirer peaux et pépins. Ajouter une pincée de sucre si les tomates sont acides."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Ajouter la crème et le basilic ciselé hors du feu — cuit, il noircit et perd son parfum."
    lexicon_ids: []
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: mediterraneenne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
