id: polenta_champignons_tomate
nom: "Polenta aux champignons et à la tomate"
origine: maison
description: >
  Une polenta crémeuse nappée d'une poêlée de champignons de Paris et de
  tomate à l'ail et à l'origan.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.5
  leger_consistant: 0.5
  chaud_froid: 0.6
  texture: creme

ingredients:
  - food_id: polenta
    quantite_g: 260
    unite_affichage: "260 g"
    optionnel: false
  - food_id: champignon_paris
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: tomate
    quantite_g: 300
    unite_affichage: "3 tomates"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 c. à soupe"
    optionnel: false
  - food_id: origan_seche
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer les champignons et concasser les tomates."
    lexicon_ids: [emincer, concasser]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Verser la polenta en pluie dans l'eau bouillante salée et remuer jusqu'à épaississement."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson
  - ordre: 3
    texte: "Faire revenir l'ail émincé dans l'huile d'olive."
    lexicon_ids: [revenir, emincer]
    timer_s: 120
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter les champignons et les faire sauter jusqu'à ce qu'ils rendent leur eau."
    lexicon_ids: [sauter]
    timer_s: 480
    timer_type: cuisson
  - ordre: 5
    texte: "Incorporer les tomates et l'origan, laisser mijoter jusqu'à obtenir une sauce épaisse."
    lexicon_ids: [incorporer, mijoter]
    timer_s: 600
    timer_type: cuisson
  - ordre: 6
    texte: "Napper la polenta de la poêlée de champignons et tomate."
    lexicon_ids: [napper]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
