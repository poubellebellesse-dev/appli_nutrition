id: soupe_carotte_gingembre
nom: "Soupe de carottes au gingembre et à l'orange"
origine: maison
description: >
  Des carottes fondues au bouillon, mixées avec du gingembre et un jus d'orange.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: /catalog/images/soupe-carotte-gingembre.avif
types_repas: [diner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: 0.2
  leger_consistant: -0.4
  chaud_froid: 0.9
  texture: liquide

ingredients:
  - food_id: carotte
    quantite_g: 900
    unite_affichage: "8 carottes"
    optionnel: false
  - food_id: orange
    quantite_g: 200
    unite_affichage: "2 oranges"
    optionnel: false
  - food_id: gingembre_poudre
    quantite_g: 5
    unite_affichage: "1,5 cuillère à café"
    optionnel: false
  - food_id: oignon
    quantite_g: 120
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 60
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: huile_colza
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer l'oignon et couper les carottes en rondelles."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire suer l'oignon dans l'huile, ajouter le gingembre et remuer une minute."
    lexicon_ids: [suer]
    timer_s: 360
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter les carottes, couvrir d'eau à hauteur et émietter le bouillon."
    lexicon_ids: [emietter]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Laisser cuire à couvert jusqu'à ce que les rondelles s'écrasent à la fourchette."
    lexicon_ids: []
    timer_s: 1500
    timer_type: cuisson
  - ordre: 5
    texte: "Mixer, saler, puis ajouter le jus d'orange HORS DU FEU — cuit, il tournerait amer. Crème au service."
    lexicon_ids: [mixer]
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: mixeur
    niveau: accelere
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
