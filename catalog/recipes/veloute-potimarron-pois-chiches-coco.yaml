id: veloute_potimarron_pois_chiches_coco
nom: "Velouté de potimarron aux pois chiches et au lait de coco"
origine: maison
description: >
  Un velouté de potimarron mixé avec des pois chiches, du lait de coco et une pointe
  de gingembre frais.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.5
  chaud_froid: 0.6
  texture: creme

ingredients:
  - food_id: potimarron
    quantite_g: 700
    unite_affichage: "1 potimarron"
    optionnel: false
  - food_id: pois_chiches
    quantite_g: 400
    unite_affichage: "1 grande boîte"
    optionnel: false
  - food_id: lait_coco
    quantite_g: 250
    unite_affichage: "1 boîte"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: gingembre_frais
    quantite_g: 10
    unite_affichage: "1 morceau de 2 cm"
    optionnel: true
  - food_id: huile_colza
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Éplucher le potimarron et le couper en cubes, émincer l'oignon et râper le gingembre."
    lexicon_ids: [eplucher, emincer, raper]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire revenir l'oignon et le gingembre dans l'huile de colza jusqu'à ce qu'ils deviennent parfumés."
    lexicon_ids: [revenir]
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter le potimarron et les pois chiches égouttés, couvrir d'eau et laisser mijoter jusqu'à ce que le potimarron soit tendre."
    lexicon_ids: [egoutter, mijoter]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 4
    texte: "Mixer avec le lait de coco jusqu'à obtenir une texture lisse, saler et rectifier la consistance avec un peu d'eau si besoin."
    lexicon_ids: [mixer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: asiatique
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: reconfortant
