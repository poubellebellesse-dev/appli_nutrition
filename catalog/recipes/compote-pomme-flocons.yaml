id: compote_pomme_flocons
nom: "Compote de pommes aux flocons d'avoine grillés"
description: >
  Une compote maison, sans sucre, couverte de flocons dorés à la poêle.
temps_prep_min: 5
temps_cuisson_min: 5
difficulte: 1
portions_base: 1
image_path: null
types_repas: [petit_dejeuner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: -0.6
  leger_consistant: 0.5
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: pomme
    quantite_g: 300
    unite_affichage: "2 pommes"
    optionnel: false
  - food_id: flocons_avoine
    quantite_g: 40
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: cannelle
    quantite_g: 1
    unite_affichage: "1 pincée"
    optionnel: false
  - food_id: sirop_erable
    quantite_g: 10
    unite_affichage: "1 cuillère à café"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Éplucher les pommes, les couper et les cuire à couvert avec un fond d'eau."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Écraser à la fourchette et parfumer à la cannelle."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Dorer les flocons à sec dans une poêle et les répartir sur la compote."
    lexicon_ids: []
    timer_s: null
    timer_type: null

facettes:
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
