id: quiche_epinards_feta
nom: "Quiche aux épinards et à la feta"
description: >
  Une pâte garnie d'épinards fondus, feta émiettée et appareil œufs-crème.
temps_prep_min: 20
temps_cuisson_min: 40
difficulte: 2
portions_base: 6
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: 0.5
  chaud_froid: 0.6
  texture: fondant

ingredients:
  - food_id: pate_feuilletee
    quantite_g: 250
    unite_affichage: "1 rouleau"
    optionnel: false
  - food_id: epinard
    quantite_g: 700
    unite_affichage: "700 g frais"
    optionnel: false
  - food_id: feta
    quantite_g: 200
    unite_affichage: "200 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 150
    unite_affichage: "3 œufs"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 150
    unite_affichage: "15 cl"
    optionnel: false
  - food_id: echalote
    quantite_g: 60
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Faire tomber les épinards par poignées dans une sauteuse, puis les égoutter en PRESSANT fort."
    lexicon_ids: [egoutter]
    timer_s: 480
    timer_type: cuisson
  - ordre: 2
    texte: "L'eau retenue est l'ennemie de la quiche : elle détremperait la pâte et empêcherait l'appareil de prendre."
    lexicon_ids: [tremper]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire suer les échalotes émincées dans l'huile, ajouter les épinards hachés."
    lexicon_ids: [emincer, hacher, suer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 4
    texte: "Battre les œufs avec la crème et le poivre. Ne pas saler : la feta apporte déjà beaucoup de sel."
    lexicon_ids: [battre]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Garnir la pâte piquée d'épinards et de feta émiettée, verser l'appareil et enfourner à 190 °C."
    lexicon_ids: [enfourner, emietter]
    timer_s: 2400
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: grecque
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
