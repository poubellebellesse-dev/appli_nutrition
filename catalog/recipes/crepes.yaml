id: crepes
nom: "Crêpes"
origine: maison
description: >
  Une pâte lisse de farine, œufs et lait, reposée puis cuite en fines crêpes au beurre.
temps_prep_min: 10
temps_cuisson_min: 25
difficulte: 2
portions_base: 6
image_path: null
types_repas: [gouter, petit_dejeuner]
service: dessert
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: 0.5
  leger_consistant: 0.3
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: farine_ble
    quantite_g: 250
    unite_affichage: "250 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 200
    unite_affichage: "4 œufs"
    optionnel: false
  - food_id: lait_demi_ecreme
    quantite_g: 500
    unite_affichage: "50 cl"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 50
    unite_affichage: "50 g fondu"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 30
    unite_affichage: "2 cuillères à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Verser la farine dans un saladier, creuser un puits et y casser les œufs avec le sel et le sucre."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Mélanger du centre vers l'extérieur en ajoutant le lait petit à petit — c'est ce sens qui évite les grumeaux."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Incorporer le beurre fondu, puis laisser reposer la pâte à température ambiante."
    lexicon_ids: [incorporer]
    timer_s: 3600
    timer_type: repos
  - ordre: 4
    texte: "Chauffer une poêle, la beurrer légèrement, verser une louche de pâte et l'étaler d'un mouvement du poignet."
    lexicon_ids: [etaler]
    timer_s: 90
    timer_type: cuisson
  - ordre: 5
    texte: "Retourner dès que les bords se décollent et que le dessous est doré, puis compter quelques secondes de plus."
    lexicon_ids: [dorer]
    timer_s: 45
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: bretonne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: convivial
