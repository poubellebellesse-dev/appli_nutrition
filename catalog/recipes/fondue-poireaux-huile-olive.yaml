id: fondue_poireaux_huile_olive
nom: "Fondue de poireaux à l'huile d'olive"
origine: maison
description: >
  Des poireaux émincés fondus à feu doux jusqu'à ce qu'ils deviennent tendres et presque sucrés,
  relevés d'un peu de thym et d'un trait de citron.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: -0.2
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: poireau
    quantite_g: 900
    unite_affichage: "6 poireaux"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 35
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: echalote
    quantite_g: 40
    unite_affichage: "1 échalote"
    optionnel: false
  - food_id: thym_seche
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: false
  - food_id: citron
    quantite_g: 20
    unite_affichage: "1/2 citron"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 1
    unite_affichage: "au goût"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Ne garder que les blancs et le vert tendre, les fendre en deux et les rincer à grande eau."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer les poireaux en fines demi-rondelles, ciseler l'échalote."
    lexicon_ids: [emincer, ciseler]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire suer les poireaux et l'échalote dans l'huile d'olive à feu doux, sans les laisser colorer."
    lexicon_ids: [suer]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Couvrir et laisser fondre à feu très doux, en remuant de temps en temps, jusqu'à ce que les poireaux s'écrasent sous la cuillère."
    lexicon_ids: [mijoter]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 5
    texte: "Saler, poivrer et réveiller d'un trait de citron hors du feu."
    lexicon_ids: [assaisonner]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
