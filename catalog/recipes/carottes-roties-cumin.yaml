id: carottes_roties_cumin
nom: "Carottes rôties au cumin"
origine: maison
description: >
  Des carottes rôties au four avec de l'huile d'olive et des graines de cumin, parsemées
  de coriandre fraîche au sortir du four.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.3
  leger_consistant: 0.0
  chaud_froid: 0.6
  texture: fondant

ingredients:
  - food_id: carotte
    quantite_g: 800
    unite_affichage: "800 g"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 5
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false
  - food_id: coriandre_fraiche
    quantite_g: 8
    unite_affichage: "quelques brins"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Préchauffer le four et éplucher les carottes avant de les tailler en bâtonnets."
    lexicon_ids: [prechauffer, eplucher, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Mélanger les carottes avec l'huile d'olive, le cumin et le sel."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Enfourner et laisser rôtir jusqu'à ce que les carottes soient tendres et légèrement caramélisées."
    lexicon_ids: [enfourner, rotir, carameliser]
    timer_s: 1800
    timer_type: cuisson
  - ordre: 4
    texte: "Ciseler la coriandre fraîche et la parsemer sur les carottes avant de servir."
    lexicon_ids: [ciseler, parsemer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: maghrebine
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
