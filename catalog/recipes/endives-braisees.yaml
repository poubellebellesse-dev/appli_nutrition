id: endives_braisees
nom: "Endives braisées au beurre"
origine: maison
description: >
  Des endives braisées lentement au beurre avec une pointe de sucre et de citron.
temps_prep_min: 10
temps_cuisson_min: 35
difficulte: 1
portions_base: 4
image_path: null
types_repas: [diner]
service: accompagnement
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: 0.1
  leger_consistant: -0.4
  chaud_froid: 0.8
  texture: fondant

ingredients:
  - food_id: endive
    quantite_g: 800
    unite_affichage: "8 endives"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 45
    unite_affichage: "45 g"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 10
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: citron
    quantite_g: 40
    unite_affichage: "1/2 citron"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 1
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Retirer le cône amer à la base de chaque endive, en creusant à la pointe du couteau."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les ranger serrées dans une sauteuse avec le beurre, le sucre, le jus de citron et le sel."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Ajouter un demi-verre d'eau seulement — les endives rendent beaucoup de jus."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Couvrir et laisser braiser à feu doux, en les retournant à mi-cuisson."
    lexicon_ids: [braiser]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 5
    texte: "Découvrir et laisser le jus réduire jusqu'à ce qu'il caramélise légèrement autour des endives."
    lexicon_ids: [reduire]
    timer_s: 600
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
