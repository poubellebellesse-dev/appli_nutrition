id: riz_complet_petits_pois
nom: "Riz complet aux petits pois"
origine: maison
description: >
  Du riz complet cuit puis mélangé à des petits pois et de l'oignon fondu, servi chaud.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.3
  leger_consistant: 0.4
  chaud_froid: 0.7
  texture: ferme

ingredients:
  - food_id: riz_complet
    quantite_g: 280
    unite_affichage: "280 g"
    optionnel: false
  - food_id: petit_pois
    quantite_g: 250
    unite_affichage: "250 g"
    optionnel: false
  - food_id: oignon
    quantite_g: 80
    unite_affichage: "1 petit oignon"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer le riz complet à l'eau claire."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer l'oignon et le faire revenir dans l'huile jusqu'à ce qu'il devienne translucide."
    lexicon_ids: [emincer, revenir]
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter le riz, mouiller à hauteur, saler et laisser cuire à couvert."
    lexicon_ids: [mouiller]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter les petits pois dix minutes avant la fin de cuisson et poursuivre à couvert."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
