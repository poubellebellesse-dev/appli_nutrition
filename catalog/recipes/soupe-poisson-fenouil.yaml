id: soupe_poisson_fenouil
nom: "Soupe de poisson au fenouil"
description: >
  Un bouillon de tomate et fenouil safrané au curcuma, où pochent des morceaux de merlu et de lieu.
temps_prep_min: 25
temps_cuisson_min: 40
difficulte: 2
portions_base: 6
image_path: null
types_repas: [diner]
service: entree
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: -0.5
  leger_consistant: 0.1
  chaud_froid: 0.9
  texture: liquide

ingredients:
  - food_id: merlu
    quantite_g: 500
    unite_affichage: "500 g"
    optionnel: false
  - food_id: lieu_colin
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: fenouil
    quantite_g: 400
    unite_affichage: "2 bulbes"
    optionnel: false
  - food_id: tomate
    quantite_g: 600
    unite_affichage: "6 tomates"
    optionnel: false
  - food_id: pomme_de_terre
    quantite_g: 400
    unite_affichage: "4 pommes de terre"
    optionnel: false
  - food_id: oignon
    quantite_g: 200
    unite_affichage: "2 oignons"
    optionnel: false
  - food_id: ail
    quantite_g: 15
    unite_affichage: "3 gousses"
    optionnel: false
  - food_id: curcuma
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 40
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 8
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer les oignons, l'ail et le fenouil, les faire fondre dans l'huile sans les colorer."
    lexicon_ids: [emincer]
    timer_s: 600
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter les tomates en dés et le curcuma, laisser compoter."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson
  - ordre: 3
    texte: "Couvrir d'un litre et demi d'eau, ajouter les pommes de terre en morceaux et saler."
    lexicon_ids: []
    timer_s: 1200
    timer_type: cuisson
  - ordre: 4
    texte: "Couper les poissons en gros morceaux et ne les ajouter qu'en fin de cuisson."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Laisser pocher à frémissement doux jusqu'à ce que la chair devienne opaque — à gros bouillons elle se déferait."
    lexicon_ids: []
    timer_s: 480
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: mediterraneenne
  - facette: regime
    valeur: pescetarien
  - facette: style
    valeur: convivial
