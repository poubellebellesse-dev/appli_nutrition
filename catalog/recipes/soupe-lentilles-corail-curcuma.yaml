id: soupe_lentilles_corail_curcuma
nom: "Soupe de lentilles corail au curcuma"
origine: maison
description: >
  Des lentilles corail fondues au bouillon avec carotte, curcuma, cumin et citron.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: /catalog/images/soupe-lentilles-corail-curcuma.avif
types_repas: [diner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.3
  leger_consistant: 0.4
  chaud_froid: 0.9
  texture: creme

ingredients:
  - food_id: lentilles_corail
    quantite_g: 250
    unite_affichage: "250 g"
    optionnel: false
  - food_id: carotte
    quantite_g: 250
    unite_affichage: "2 carottes"
    optionnel: false
  - food_id: oignon
    quantite_g: 120
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: curcuma
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube"
    optionnel: false
  - food_id: citron
    quantite_g: 50
    unite_affichage: "1 citron"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: coriandre_fraiche
    quantite_g: 15
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer l'oignon, couper les carottes en rondelles fines."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire suer l'oignon dans l'huile, ajouter le curcuma et le cumin et remuer une minute."
    lexicon_ids: [suer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter les carottes et les lentilles rincées, couvrir d'un litre d'eau et émietter le bouillon."
    lexicon_ids: [rincer, emietter]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Laisser mijoter jusqu'à ce que les lentilles se défassent complètement — elles n'ont pas besoin de trempage."
    lexicon_ids: [mijoter]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 5
    texte: "Mixer ou laisser rustique, saler, puis réveiller d'un bon trait de jus de citron et de coriandre."
    lexicon_ids: [mixer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: indienne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
