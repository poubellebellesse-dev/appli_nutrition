id: poivrons_farcis_riz_boeuf
nom: "Poivrons farcis au riz et au bœuf"
origine: maison
description: >
  Des poivrons évidés, garnis de riz et de bœuf haché aux herbes, cuits au four en sauce tomate.
temps_prep_min: 25
temps_cuisson_min: 50
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.7
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: poivron_rouge
    quantite_g: 800
    unite_affichage: "4 gros poivrons"
    optionnel: false
  - food_id: boeuf_hache_5
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: riz_blanc
    quantite_g: 150
    unite_affichage: "150 g"
    optionnel: false
  - food_id: tomate
    quantite_g: 400
    unite_affichage: "4 tomates"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: ail
    quantite_g: 12
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: origan_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 6
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Cuire le riz à moitié seulement — il finira de gonfler dans les poivrons."
    lexicon_ids: []
    timer_s: 480
    timer_type: cuisson
  - ordre: 2
    texte: "Découper un chapeau aux poivrons, retirer graines et cloisons blanches."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire revenir l'oignon et l'ail émincés, ajouter le bœuf et le cuire en l'écrasant jusqu'à ce qu'il ne soit plus rosé — au four, la farce est protégée par le poivron et chauffe moins qu'on ne le croit."
    lexicon_ids: [emincer, revenir]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Mêler la viande, le riz, l'origan et le sel, puis garnir les poivrons sans tasser."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Poser les poivrons dans un plat sur un lit de tomates concassées, arroser d'huile et enfourner à 190 °C à couvert."
    lexicon_ids: [concasser, arroser, enfourner]
    timer_s: 2400
    timer_type: cuisson

equipements:
