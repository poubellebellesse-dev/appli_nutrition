id: soupe_potiron_noisettes
nom: "Velouté de potiron aux noisettes"
origine: maison
description: >
  Un velouté de potiron et pomme de terre, lié à la crème, parsemé de noisettes concassées.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [diner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.1
  leger_consistant: -0.2
  chaud_froid: 0.9
  texture: liquide

ingredients:
  - food_id: potiron
    quantite_g: 800
    unite_affichage: "800 g de chair"
    optionnel: false
  - food_id: pomme_de_terre
    quantite_g: 200
    unite_affichage: "2 pommes de terre"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 80
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: noisette
    quantite_g: 40
    unite_affichage: "une poignée"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 20
    unite_affichage: "20 g"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer l'oignon et le faire fondre dans le beurre sans le colorer."
    lexicon_ids: [emincer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter le potiron et les pommes de terre en cubes, couvrir d'eau à hauteur et émietter le cube de bouillon."
    lexicon_ids: [tailler_des, emietter]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Laisser cuire à couvert jusqu'à ce que la lame d'un couteau traverse les cubes sans résistance."
    lexicon_ids: []
    timer_s: 1500
    timer_type: cuisson
  - ordre: 4
    texte: "Mixer finement, incorporer la crème, rectifier le sel et parsemer de noisettes concassées à l'assiette."
    lexicon_ids: [concasser, mixer, incorporer, parsemer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
