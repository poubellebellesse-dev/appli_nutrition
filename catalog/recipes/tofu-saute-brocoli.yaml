id: tofu_saute_brocoli
nom: "Tofu sauté au brocoli"
origine: maison
description: >
  Des dés de tofu dorés à la poêle avec du brocoli croquant, de l'ail et du poivron.
temps_prep_min: 15
temps_cuisson_min: 15
difficulte: 2
portions_base: 2
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: 0.1
  chaud_froid: 0.7
  texture: croquant

ingredients:
  - food_id: tofu_nature
    quantite_g: 300
    unite_affichage: "300 g"
    optionnel: false
  - food_id: brocoli
    quantite_g: 400
    unite_affichage: "1 brocoli"
    optionnel: false
  - food_id: poivron_rouge
    quantite_g: 150
    unite_affichage: "1 poivron"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Détailler le brocoli en petits bouquets et les blanchir deux minutes à l'eau bouillante salée, puis les égoutter."
    lexicon_ids: [blanchir, egoutter, detailler]
    timer_s: 120
    timer_type: cuisson
  - ordre: 2
    texte: "Éponger le tofu et le couper en dés d'environ deux centimètres."
    lexicon_ids: [tailler_des, eponger]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire dorer les dés de tofu sur toutes leurs faces dans l'huile bien chaude, puis les réserver."
    lexicon_ids: [dorer, reserver]
    timer_s: 480
    timer_type: cuisson
  - ordre: 4
    texte: "Émincer l'ail et le poivron, les sauter à feu vif, ajouter le brocoli puis le tofu, saler et servir aussitôt."
    lexicon_ids: [emincer]
    timer_s: 300
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: asiatique
  # Une seule facette — voir lentilles-vertes-carottes.yaml : la chaîne d'inclusion des régimes
  # rend l'énumération inutile.
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
