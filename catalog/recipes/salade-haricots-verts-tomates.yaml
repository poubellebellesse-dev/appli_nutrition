id: salade_haricots_verts_tomates
nom: "Salade de haricots verts et tomates à l'échalote"
origine: maison
description: >
  Des haricots verts croquants et des tomates en quartiers, vinaigrette à l'échalote.
temps_prep_min: 15
temps_cuisson_min: 10
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: entree
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: -0.5
  chaud_froid: -0.7
  texture: croquant

ingredients:
  - food_id: haricot_vert
    quantite_g: 600
    unite_affichage: "600 g"
    optionnel: false
  - food_id: tomate
    quantite_g: 400
    unite_affichage: "4 tomates"
    optionnel: false
  - food_id: echalote
    quantite_g: 60
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: moutarde_dijon
    quantite_g: 12
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: vinaigre_vin_rouge
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 45
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: persil
    quantite_g: 15
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Équeuter les haricots et les cuire à grande eau bouillante salée, à découvert."
    lexicon_ids: [equeuter]
    timer_s: 540
    timer_type: cuisson
  - ordre: 2
    texte: "Les rafraîchir aussitôt à l'eau glacée : cela fixe le vert et stoppe net la cuisson."
    lexicon_ids: []
    timer_s: 120
    timer_type: repos
  - ordre: 3
    texte: "Les égoutter longuement, une salade tiède d'eau serait fade."
    lexicon_ids: [egoutter]
    timer_s: 300
    timer_type: repos
  - ordre: 4
    texte: "Délayer la moutarde avec le vinaigre et le sel, monter à l'huile, ajouter l'échalote émincée."
    lexicon_ids: [emincer, detendre]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Mélanger haricots et tomates en quartiers à la vinaigrette juste avant de servir, parsemer de persil."
    lexicon_ids: [parsemer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
