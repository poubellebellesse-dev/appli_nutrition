id: blanquette_veau
nom: "Blanquette de veau"
origine: maison
description: >
  Du veau poché au bouillon avec carottes et champignons, lié d'une sauce blanche à la crème.
temps_prep_min: 25
temps_cuisson_min: 95
difficulte: 3
portions_base: 6
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
porte_deja_une_sauce: true
saison_mois: []
envergure: fete
conservation_jours: 3
axes:
  sucre_sale: -0.3
  leger_consistant: 0.7
  chaud_froid: 0.9
  texture: creme

ingredients:
  - food_id: veau_escalope
    quantite_g: 1200
    unite_affichage: "1,2 kg de sauté de veau"
    optionnel: false
  - food_id: carotte
    quantite_g: 400
    unite_affichage: "4 carottes"
    optionnel: false
  - food_id: poireau
    quantite_g: 200
    unite_affichage: "1 poireau"
    optionnel: false
  - food_id: champignon_paris
    quantite_g: 300
    unite_affichage: "300 g"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 50
    unite_affichage: "50 g"
    optionnel: false
  - food_id: farine_ble
    quantite_g: 50
    unite_affichage: "50 g"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 200
    unite_affichage: "20 cl"
    optionnel: false
  - food_id: jaune_oeuf
    quantite_g: 76
    unite_affichage: "4 jaunes d'œufs"
    optionnel: false
  - food_id: citron
    quantite_g: 40
    unite_affichage: "1/2 citron"
    optionnel: false
  - food_id: laurier
    quantite_g: 1
    unite_affichage: "1 feuille"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 8
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Mettre le veau dans une cocotte, couvrir d'eau froide et porter doucement à frémissement. Écumer la mousse grise."
    lexicon_ids: [fremir]
    timer_s: 900
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter l'oignon, le poireau, les carottes en tronçons et le laurier. Saler et laisser frémir à couvert — jamais bouillir, la viande durcirait."
    lexicon_ids: [fremir]
    timer_s: 4200
    timer_type: cuisson
  - ordre: 3
    texte: "Faire sauter les champignons émincés au beurre à part, puis les réserver."
    lexicon_ids: [emincer, reserver, sauter]
    timer_s: 480
    timer_type: cuisson
  - ordre: 4
    texte: "Prélever un litre de bouillon filtré. Faire un roux avec le reste du beurre et la farine, puis verser le bouillon en fouettant."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson
  - ordre: 5
    texte: "Hors du feu, délayer les jaunes d'œufs dans la crème et verser le mélange dans la sauce SANS la faire rebouillir — elle trancherait. Ajouter le jus de citron, puis y réunir la viande, les légumes et les champignons."
    lexicon_ids: [incorporer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: omnivore
  - facette: occasion
    valeur: repas_de_fete
  - facette: style
    valeur: convivial

