id: chou_fleur_roti_curcuma
nom: "Chou-fleur rôti au curcuma"
description: >
  Des bouquets de chou-fleur rôtis au four avec curcuma, cumin et amandes.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [diner]
service: accompagnement
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: -0.2
  chaud_froid: 0.8
  texture: croquant

ingredients:
  - food_id: chou_fleur
    quantite_g: 900
    unite_affichage: "1 chou-fleur"
    optionnel: false
  - food_id: curcuma
    quantite_g: 5
    unite_affichage: "2 cuillères à café"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: amande_effilee
    quantite_g: 40
    unite_affichage: "40 g"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 45
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: citron
    quantite_g: 50
    unite_affichage: "1/2 citron"
    optionnel: true
  - food_id: coriandre_fraiche
    quantite_g: 15
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 210 °C. Détailler le chou-fleur en petits bouquets."
    lexicon_ids: [prechauffer, detailler]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les mélanger dans un saladier avec l'huile, le curcuma, le cumin et le sel, jusqu'à ce qu'ils soient tous colorés."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Les étaler en UNE SEULE COUCHE : entassés, ils cuiraient à la vapeur au lieu de rôtir."
    lexicon_ids: [rotir, vapeur, etaler]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Enfourner en remuant une fois, jusqu'à ce que les pointes brunissent et croustillent."
    lexicon_ids: [enfourner]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 5
    texte: "Ajouter les amandes effilées pour les cinq dernières minutes, puis citronner et parsemer de coriandre."
    lexicon_ids: [parsemer]
    timer_s: 300
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: indienne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
