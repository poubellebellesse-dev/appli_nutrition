etapes:
  - ordre: 1
    texte: "Porter une grande casserole d'eau salée à ébullition et y cuire les spaghettis."
    lexicon_ids: []
    timer_s: 540
    timer_type: cuisson
  - ordre: 2
    texte: "Effeuiller le basilic. Piler l'ail avec une pincée de sel, puis ajouter les feuilles petit à petit."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Incorporer les cerneaux de noix concassés et le parmesan râpé, puis verser l'huile d'olive en filet sans cesser de piler."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Égoutter les pâtes en gardant une louche d'eau de cuisson, mélanger au pesto hors du feu et détendre avec l'eau réservée."
    lexicon_ids: []
    timer_s: null
    timer_type: null

