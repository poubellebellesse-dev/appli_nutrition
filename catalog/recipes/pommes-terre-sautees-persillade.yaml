id: pommes_terre_sautees_persillade
nom: "Pommes de terre sautées en persillade"
origine: maison
description: >
  Des dés de pommes de terre dorés à la poêle, finis à l'ail et au persil.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 2
portions_base: 4
image_path: null
types_repas: [diner]
service: accompagnement
piquant: 0
sauces:
  - sauce_yaourt_citron_ciboulette
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: 0.6
  chaud_froid: 0.9
  texture: croquant

ingredients:
  - food_id: pomme_de_terre
    quantite_g: 900
    unite_affichage: "6 pommes de terre"
    optionnel: false
  - food_id: ail
    quantite_g: 15
    unite_affichage: "3 gousses"
    optionnel: false
  - food_id: persil
    quantite_g: 25
    unite_affichage: "1/2 bouquet"
    optionnel: false
  - food_id: beurre_demi_sel
    quantite_g: 35
    unite_affichage: "35 g"
    optionnel: false
  - food_id: huile_tournesol
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Couper les pommes de terre en dés de deux centimètres, les rincer puis les SÉCHER complètement."
    lexicon_ids: [rincer, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les jeter dans l'huile bien chaude, en une seule couche, et ne pas les remuer pendant les premières minutes."
    lexicon_ids: []
    timer_s: 480
    timer_type: cuisson
  - ordre: 3
    texte: "Les retourner par tiers, puis couvrir et baisser le feu pour que le cœur cuise."
    lexicon_ids: []
    timer_s: 900
    timer_type: cuisson
  - ordre: 4
    texte: "Découvrir, monter le feu et ajouter le beurre pour finir de dorer."
    lexicon_ids: [dorer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 5
    texte: "Hors du feu, ajouter l'ail émincé et le persil : cuits, ils brûleraient et deviendraient amers."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
