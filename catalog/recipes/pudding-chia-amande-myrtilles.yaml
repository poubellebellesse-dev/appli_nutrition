id: pudding_chia_amande_myrtilles
nom: "Pudding de chia à la boisson d'amande et aux myrtilles"
origine: maison
description: >
  Des graines de chia gonflées toute une nuit dans une boisson d'amande, servies
  froides avec des myrtilles et un filet de sirop d'agave.
temps_prep_min: 10
temps_cuisson_min: 0
difficulte: 1
