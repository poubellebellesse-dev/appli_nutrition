id: pois_chiches_roties_herbes
nom: "Pois chiches rôtis aux herbes"
origine: maison
description: >
  Des pois chiches enrobés d'huile d'olive, d'ail et d'herbes de Provence, rôtis au four jusqu'à devenir croustillants.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.5
  leger_consistant: 0.3
  chaud_froid: 0.5
  texture: croquant

ingredients:
  - food_id: pois_chiches
    quantite_g: 500
    unite_affichage: "500 g"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: herbes_provence
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: ail
    quantite_g: 8
    unite_affichage: "2 gousses"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four et éponger les pois chiches égouttés."
    lexicon_ids: [prechauffer, eponger, egoutter]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Écraser l'ail et mélanger les pois chiches avec l'huile d'olive, l'ail, les herbes de Provence et le sel."
    lexicon_ids: [ecraser, assaisonner]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Étaler sur une plaque et enfourner jusqu'à ce qu'ils soient dorés et croustillants."
    lexicon_ids: [etaler, enfourner, dorer]
    timer_s: 1800
    timer_type: cuisson

equipements:
  - code: four
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: passoire
    niveau: informatif
  - code: saladier
    niveau: informatif
  - code: plaque_patisserie
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: mediterraneenne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
