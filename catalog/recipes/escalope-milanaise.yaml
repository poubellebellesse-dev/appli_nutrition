id: escalope_milanaise
nom: "Escalope de veau à la milanaise"
description: >
  Une escalope panée à l'œuf et à la chapelure, poêlée au beurre et servie au citron.
temps_prep_min: 15
temps_cuisson_min: 12
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: convivial
conservation_jours: 1
axes:
  sucre_sale: -0.4
  leger_consistant: 0.6
  chaud_froid: 0.8
  texture: croquant

ingredients:
  - food_id: veau_escalope
    quantite_g: 600
    unite_affichage: "4 escalopes"
    optionnel: false
  - food_id: chapelure
    quantite_g: 120
    unite_affichage: "120 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 100
    unite_affichage: "2 œufs"
    optionnel: false
  - food_id: farine_ble
    quantite_g: 60
    unite_affichage: "60 g"
    optionnel: false
  - food_id: parmesan
    quantite_g: 40
    unite_affichage: "40 g râpé"
    optionnel: true
  - food_id: beurre_doux
    quantite_g: 60
    unite_affichage: "60 g"
    optionnel: false
  - food_id: citron
    quantite_g: 80
    unite_affichage: "1 citron"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Aplatir les escalopes entre deux feuilles de papier, jusqu'à une épaisseur régulière de cinq millimètres."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Préparer trois assiettes : farine salée, œufs battus, chapelure mêlée au parmesan."
    lexicon_ids: [battre]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Passer chaque escalope dans la farine, l'œuf, puis la chapelure en appuyant fermement."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Faire mousser le beurre à feu moyen et cuire les escalopes sans les entasser."
    lexicon_ids: []
    timer_s: 360
    timer_type: cuisson
  - ordre: 5
    texte: "Les retourner une seule fois, puis les égoutter sur du papier absorbant et servir avec le citron."
    lexicon_ids: [egoutter]
    timer_s: 360
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: omnivore
  - facette: style
    valeur: convivial
