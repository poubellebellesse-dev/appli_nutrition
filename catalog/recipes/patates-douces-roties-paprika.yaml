id: patates_douces_roties_paprika
nom: "Patates douces rôties au paprika"
origine: maison
description: >
  Des morceaux de patate douce enrobés d'huile d'olive, d'ail et de paprika, rôtis au four
  jusqu'à ce que l'extérieur caramélise et que l'intérieur reste fondant.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.3
  leger_consistant: 0.1
  chaud_froid: 0.6
  texture: fondant

ingredients:
  - food_id: patate_douce
    quantite_g: 800
    unite_affichage: "800 g"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: paprika
    quantite_g: 5
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four et détailler les patates douces en cubes réguliers."
    lexicon_ids: [prechauffer, detailler]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Écraser l'ail et mélanger les cubes avec l'huile d'olive, le paprika, l'ail et le sel."
    lexicon_ids: [ecraser]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Enfourner en une seule couche et laisser rôtir jusqu'à ce que les bords caramélisent."
    lexicon_ids: [enfourner, rotir, carameliser]
    timer_s: 1800
    timer_type: cuisson

equipements:
  - code: four
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: saladier
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: simple
