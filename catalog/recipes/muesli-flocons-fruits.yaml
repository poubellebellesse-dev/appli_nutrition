    texte: "Laisser gonfler au réfrigérateur toute la nuit — c'est ce trempage qui remplace la cuisson."
    lexicon_ids: []
    timer_s: 28800
    timer_type: repos
  - ordre: 3
    texte: "Au matin, râper la pomme avec sa peau et l'arroser de quelques gouttes de citron."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Mélanger la pomme aux flocons, ajouter le miel et la cannelle, puis parsemer de noisettes concassées."
