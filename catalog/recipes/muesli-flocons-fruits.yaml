id: muesli_flocons_fruits
nom: "Muesli aux flocons d'avoine, pomme et noisettes"
description: >
  Des flocons d'avoine trempés dans le lait une nuit, garnis de pomme râpée et de noisettes.
temps_prep_min: 10
temps_cuisson_min: 0
