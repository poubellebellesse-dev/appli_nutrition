id: dorade_four_fenouil_olives
nom: "Dorade au four, fenouil et olives noires"
description: >
  Une dorade entière rôtie sur un lit de fenouil, avec olives noires, citron et origan.
temps_prep_min: 15
temps_cuisson_min: 35
difficulte: 2
portions_base: 2
image_path: null
types_repas: [diner]
saison_mois: []
envergure: convivial
conservation_jours: 1
axes:
  sucre_sale: -0.6
  leger_consistant: 0.0
  chaud_froid: 0.7
  texture: fondant

ingredients:
  - food_id: dorade
    quantite_g: 600
    unite_affichage: "1 dorade vidée"
    optionnel: false
  - food_id: fenouil
    quantite_g: 400
    unite_affichage: "2 bulbes"
    optionnel: false
  - food_id: olive_noire
    quantite_g: 60
    unite_affichage: "une poignée"
    optionnel: false
  - food_id: citron
    quantite_g: 60
    unite_affichage: "1 citron"
    optionnel: false
  - food_id: origan_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 200 °C. Émincer les bulbes de fenouil et l'ail."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Étaler le fenouil dans un plat, arroser de la moitié de l'huile, saler et enfourner seul."
    lexicon_ids: []
    timer_s: 900
    timer_type: cuisson
  - ordre: 3
    texte: "Glisser des rondelles de citron dans le ventre de la dorade, l'inciser sur chaque flanc."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Poser le poisson sur le fenouil, ajouter les olives, l'origan et le reste d'huile."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Remettre au four jusqu'à ce que la chair se détache facilement de l'arête centrale."
    lexicon_ids: []
    timer_s: 1200
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: mediterraneenne
  - facette: regime
    valeur: pescetarien
  - facette: style
    valeur: convivial
