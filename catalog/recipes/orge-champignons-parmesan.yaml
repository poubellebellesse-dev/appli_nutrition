id: orge_champignons_parmesan
nom: "Orge perlé aux champignons"
origine: maison
description: >
  De l'orge perlé cuit façon risotto avec des champignons, monté au parmesan.
temps_prep_min: 15
temps_cuisson_min: 45
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.6
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: orge_perle
    quantite_g: 280
    unite_affichage: "280 g"
    optionnel: false
  - food_id: champignon_paris
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: parmesan
    quantite_g: 70
    unite_affichage: "70 g râpé"
    optionnel: false
  - food_id: echalote
    quantite_g: 60
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube pour 1 litre"
    optionnel: false
  - food_id: vin_blanc_cuisine
    quantite_g: 100
    unite_affichage: "10 cl"
    optionnel: true
  - food_id: beurre_doux
    quantite_g: 30
    unite_affichage: "30 g"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: persil
    quantite_g: 15
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer l'orge perlé à l'eau froide et maintenir le bouillon frémissant à côté."
    lexicon_ids: [rincer, fremir]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer les échalotes et les champignons, faire sauter les champignons à feu vif dans l'huile puis les réserver."
    lexicon_ids: [emincer, reserver, sauter]
    timer_s: 600
    timer_type: cuisson
  - ordre: 3
    texte: "Faire suer les échalotes, ajouter l'orge et le remuer une minute, puis déglacer au vin blanc."
    lexicon_ids: [suer, deglacer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 4
    texte: "Verser le bouillon louche par louche en remuant — l'orge met plus longtemps que le riz et reste plus ferme."
    lexicon_ids: []
    timer_s: 2100
    timer_type: cuisson
  - ordre: 5
    texte: "Hors du feu, incorporer le beurre, le parmesan et les champignons réservés, saler et parsemer de persil."
    lexicon_ids: [incorporer, parsemer, reserver]
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: passoire
    niveau: informatif
  - code: saladier
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
