id: veloute_topinambour
nom: "Velouté de topinambours"
origine: maison
description: >
  Des topinambours fondus au bouillon puis mixés, relevés d'une pointe de noisette grillée.
temps_prep_min: 20
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: /catalog/images/soupe-potiron-topinambour.avif
types_repas: [diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.2
  leger_consistant: -0.2
  chaud_froid: 0.9
  texture: liquide

ingredients:
  - food_id: topinambour
    quantite_g: 800
    unite_affichage: "800 g"
    optionnel: false
  - food_id: pomme_de_terre
    quantite_g: 200
    unite_affichage: "2 pommes de terre"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 80
    unite_affichage: "4 cuillères à soupe"
    optionnel: true
  - food_id: noisette
    quantite_g: 40
    unite_affichage: "une poignée"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 25
    unite_affichage: "25 g"
    optionnel: false
  - food_id: citron
    quantite_g: 30
    unite_affichage: "1/2 citron"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Peler les topinambours et les plonger au fur et à mesure dans de l'eau citronnée, ils noircissent très vite à l'air."
    lexicon_ids: [eplucher]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer l'oignon et le faire fondre dans le beurre sans coloration."
    lexicon_ids: [emincer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter les topinambours et les pommes de terre en morceaux, couvrir d'eau et émietter le bouillon."
    lexicon_ids: [emietter]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Laisser cuire jusqu'à ce que la lame d'un couteau traverse sans résistance."
    lexicon_ids: []
    timer_s: 1500
    timer_type: cuisson
  - ordre: 5
    texte: "Mixer finement, saler, incorporer la crème et parsemer de noisettes concassées et grillées à sec."
    lexicon_ids: [concasser, mixer, incorporer, parsemer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
