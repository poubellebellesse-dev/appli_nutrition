id: houmous_pois_chiches
nom: "Houmous de pois chiches au sésame"
description: >
  Des pois chiches écrasés avec des graines de sésame moulues, citron, ail et cumin.
temps_prep_min: 15
temps_cuisson_min: 0
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.1
  chaud_froid: -0.5
  texture: creme

ingredients:
  - food_id: pois_chiches
    quantite_g: 500
    unite_affichage: "1 grande conserve égouttée"
    optionnel: false
  - food_id: sesame_graine
    quantite_g: 60
    unite_affichage: "6 cuillères à soupe"
    optionnel: false
  - food_id: citron
    quantite_g: 80
    unite_affichage: "1 gros citron"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 50
    unite_affichage: "5 cuillères à soupe"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: paprika
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Faire griller les graines de sésame à sec quelques minutes, puis les moudre finement."
    lexicon_ids: []
    timer_s: 240
    timer_type: cuisson
  - ordre: 2
    texte: "Rincer les pois chiches et retirer les peaux qui se détachent — c'est ce qui rend le houmous lisse."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Mixer les pois chiches avec le sésame moulu, l'ail, le jus de citron, le cumin et le sel."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Verser l'huile en filet pendant que le robot tourne, et détendre avec un peu d'eau froide jusqu'à la texture voulue."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Dresser en creusant un sillon à la cuillère, arroser d'huile et saupoudrer de paprika."
    lexicon_ids: []
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: libanaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
