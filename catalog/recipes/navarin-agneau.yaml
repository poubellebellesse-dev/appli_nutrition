id: navarin_agneau
nom: "Navarin d'agneau aux légumes primeurs"
origine: maison
description: >
  De l'épaule d'agneau mijotée avec navets, carottes, petits pois et pommes de terre.
temps_prep_min: 25
temps_cuisson_min: 80
difficulte: 2
portions_base: 6
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
porte_deja_une_sauce: true
saison_mois: []
envergure: convivial
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.8
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: agneau_epaule
    quantite_g: 1200
    unite_affichage: "1,2 kg en morceaux"
    optionnel: false
  - food_id: navet
    quantite_g: 400
    unite_affichage: "4 navets"
    optionnel: false
  - food_id: carotte
    quantite_g: 400
    unite_affichage: "4 carottes"
    optionnel: false
  - food_id: pomme_de_terre
    quantite_g: 500
    unite_affichage: "5 pommes de terre"
    optionnel: false
  - food_id: petit_pois
    quantite_g: 200
    unite_affichage: "200 g"
    optionnel: true
  - food_id: concentre_tomate
    quantite_g: 30
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: farine_ble
    quantite_g: 30
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: ail
    quantite_g: 5
    unite_affichage: "1 gousse"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 3
    unite_affichage: "1 pincée"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: thym_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 8
