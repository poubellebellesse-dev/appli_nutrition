etapes:
  - ordre: 1
    texte: "Colorer les morceaux d'agneau dans l'huile très chaude, en plusieurs fois pour qu'ils dorent vraiment. Une pincée de sucre jetée en fin de coloration caramélise et donne sa couleur à la sauce."
    lexicon_ids: []
    timer_s: 900
    timer_type: cuisson
  - ordre: 2
    texte: "Saupoudrer de farine, remuer, puis ajouter le concentré de tomate, l'oignon émincé et la gousse d'ail écrasée."
    lexicon_ids: [emincer, saupoudrer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 3
    texte: "Mouiller à hauteur d'eau chaude, ajouter le thym et le sel, couvrir et laisser mijoter."
    lexicon_ids: [mijoter, mouiller]
    timer_s: 2700
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter navets, carottes et pommes de terre en gros morceaux, poursuivre la cuisson à couvert."
    lexicon_ids: []
    timer_s: 1800
    timer_type: cuisson
  - ordre: 5
    texte: "Jeter les petits pois dans les cinq dernières minutes seulement, pour qu'ils gardent leur couleur."
    lexicon_ids: []
    timer_s: 300
    timer_type: cuisson

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif

facettes:
