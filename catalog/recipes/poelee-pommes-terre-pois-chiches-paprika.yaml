id: poelee_pommes_terre_pois_chiches_paprika
nom: "Poêlée de pommes de terre et pois chiches au paprika"
origine: maison
description: >
  Des pommes de terre et des pois chiches sautés à la poêle avec poivron rouge et oignon,
  relevés au paprika et parsemés de persil.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.5
  leger_consistant: 0.5
  chaud_froid: 0.6
  texture: fondant

ingredients:
  - food_id: pomme_de_terre
    quantite_g: 700
    unite_affichage: "4 pommes de terre"
    optionnel: false
  - food_id: pois_chiches
    quantite_g: 400
    unite_affichage: "1 grand bol"
    optionnel: false
  - food_id: poivron_rouge
    quantite_g: 200
    unite_affichage: "1 poivron"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: paprika
    quantite_g: 5
    unite_affichage: "1 c. à café"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 c. à soupe"
    optionnel: false
  - food_id: persil
    quantite_g: 10
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Éplucher les pommes de terre et les tailler en dés."
    lexicon_ids: [eplucher, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer l'oignon et le poivron, égoutter les pois chiches."
    lexicon_ids: [emincer, egoutter]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire sauter les pommes de terre à la poêle jusqu'à ce qu'elles soient dorées."
    lexicon_ids: [sauter, dorer]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter l'oignon, le poivron et les pois chiches, saupoudrer de paprika et poursuivre la cuisson."
    lexicon_ids: [saupoudrer]
    timer_s: 600
    timer_type: cuisson
  - ordre: 5
    texte: "Parsemer de persil ciselé avant de servir."
    lexicon_ids: [parsemer, ciseler]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: espagnole
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
