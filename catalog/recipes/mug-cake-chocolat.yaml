id: mug_cake_chocolat
nom: "Mug cake au chocolat"
origine: maison
description: >
  Un gâteau individuel mélangé directement dans la tasse et cuit au micro-ondes en moins
  de deux minutes. Le cœur reste coulant si on l'arrête à temps.
temps_prep_min: 5
temps_cuisson_min: 2
difficulte: 1
portions_base: 1
image_path: null
types_repas: [gouter]
service: dessert
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: 0.8
  leger_consistant: 0.3
  chaud_froid: 0.9
  texture: moelleux

ingredients:
  - food_id: farine_ble
    quantite_g: 30
    unite_affichage: "4 cuillères à soupe"
    optionnel: false
  - food_id: cacao_poudre
    quantite_g: 10
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sucre_blanc
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: oeuf
    quantite_g: 60
    unite_affichage: "1 œuf"
    optionnel: false
  - food_id: lait_demi_ecreme
    quantite_g: 45
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: huile_tournesol
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: chocolat_noir
    quantite_g: 20
    unite_affichage: "2 carrés"
    optionnel: true
  - food_id: levure_chimique
    quantite_g: 2
    unite_affichage: "un quart de sachet"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Mélanger la farine, le cacao, le sucre et la levure directement dans une grande tasse."
    lexicon_ids: [incorporer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Ajouter l'œuf, le lait et l'huile, puis battre à la fourchette jusqu'à ce qu'il ne reste aucune trace sèche au fond."
    lexicon_ids: [battre]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Enfoncer les carrés de chocolat au centre, sans les recouvrir de pâte."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Cuire au micro-ondes à pleine puissance, en surveillant : le gâteau doit monter puis retomber à peine."
    # ⚠️ LA SEULE OCCUPATION DE MICRO-ONDES DU CATALOGUE. Le détecteur ne connaît que des gestes de
    # four ; en ajouter un pour un cas unique aurait été une règle écrite pour une seule recette.
    occupe:
      - code: micro_ondes
    lexicon_ids: []
    timer_s: 100
    timer_type: cuisson
  - ordre: 5
    texte: "Laisser reposer le temps que le cœur finisse de prendre, puis manger à la cuillère dans la tasse."
    lexicon_ids: [reserver]
    timer_s: 120
    timer_type: repos
  - ordre: 6
    texte: "Trente secondes de trop et la mie devient caoutchouteuse — le micro-ondes continue de cuire après l'arrêt."
    lexicon_ids: []
    timer_s: null
    timer_type: null
    nature: avertissement

equipements:
  - code: micro_ondes
    niveau: requis

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: loufoque
