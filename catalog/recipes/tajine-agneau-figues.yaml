id: tajine_agneau_figues
nom: "Tajine d'agneau aux figues sèches"
description: >
  De l'épaule d'agneau mijotée aux oignons, figues sèches, cannelle et gingembre.
temps_prep_min: 20
temps_cuisson_min: 100
difficulte: 2
portions_base: 6
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: fete
conservation_jours: 3
axes:
  sucre_sale: 0.3
  leger_consistant: 0.8
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: agneau_epaule
    quantite_g: 1200
    unite_affichage: "1,2 kg en morceaux"
    optionnel: false
  - food_id: figue_seche
    quantite_g: 250
    unite_affichage: "15 figues"
    optionnel: false
  - food_id: oignon
    quantite_g: 400
    unite_affichage: "3 oignons"
    optionnel: false
  - food_id: cannelle
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: gingembre_poudre
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: miel
    quantite_g: 30
    unite_affichage: "2 cuillères à soupe"
    optionnel: true
  - food_id: amande_effilee
    quantite_g: 50
    unite_affichage: "50 g"
    optionnel: true
  - food_id: huile_olive
    quantite_g: 35
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 8
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Colorer les morceaux d'agneau dans l'huile, en plusieurs fois."
    lexicon_ids: []
    timer_s: 900
    timer_type: cuisson
  - ordre: 2
    texte: "Ajouter les oignons émincés, la cannelle, le gingembre et le sel, remuer pour enrober."
    lexicon_ids: [emincer]
    timer_s: 480
    timer_type: cuisson
  - ordre: 3
    texte: "Mouiller à mi-hauteur d'eau chaude, couvrir et laisser mijoter à feu très doux."
    lexicon_ids: [mijoter]
    timer_s: 4200
    timer_type: cuisson
  - ordre: 4
    texte: "Faire tremper les figues dans l'eau tiède pendant la cuisson, puis les ajouter avec le miel pour la dernière demi-heure."
    lexicon_ids: []
    timer_s: 1800
    timer_type: cuisson
  - ordre: 5
    texte: "Faire dorer les amandes à sec et en parsemer le plat au moment de servir."
    lexicon_ids: [dorer, parsemer]
    timer_s: 180
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: maghrebine
  - facette: regime
    valeur: omnivore
  - facette: occasion
    valeur: repas_de_fete
  - facette: style
    valeur: convivial
