id: oeufs_plat_tomates_basilic
nom: "Œufs au plat aux tomates et basilic"
origine: maison
description: >
  Des œufs cuits sur un lit de tomates poêlées à l'ail, parsemés de basilic.
temps_prep_min: 10
temps_cuisson_min: 15
difficulte: 1
portions_base: 2
image_path: null
types_repas: [petit_dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 1
axes:
  sucre_sale: -0.5
  leger_consistant: 0.1
  chaud_froid: 0.8
  texture: fondant

ingredients:
  - food_id: oeuf
    quantite_g: 200
    unite_affichage: "4 œufs"
    optionnel: false
  - food_id: tomate
    quantite_g: 400
    unite_affichage: "4 tomates"
    optionnel: false
  - food_id: ail
    quantite_g: 8
    unite_affichage: "1 gousse"
    optionnel: false
  - food_id: basilic_frais
    quantite_g: 15
    unite_affichage: "quelques feuilles"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: pain_complet
    quantite_g: 120
    unite_affichage: "4 tranches"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 3
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Couper les tomates en quartiers et émincer l'ail."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les faire revenir dans l'huile à feu vif jusqu'à ce qu'elles s'affaissent et rendent leur jus."
    lexicon_ids: [revenir]
    timer_s: 480
    timer_type: cuisson
  - ordre: 3
    texte: "Saler, puis creuser quatre puits dans la compotée."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Y casser les œufs, couvrir et baisser le feu pour que le blanc prenne sans que le jaune durcisse."
    lexicon_ids: []
    timer_s: 300
    timer_type: cuisson
  - ordre: 5
    texte: "Parsemer de basilic déchiré et servir dans la poêle, avec du pain grillé."
    lexicon_ids: [parsemer]
    timer_s: null
    timer_type: null
  - ordre: 6
    texte: "L'ANSES recommande aux personnes âgées, aux personnes immunodéprimées, aux jeunes enfants et aux femmes enceintes de ne pas consommer d'œufs crus ou peu cuits."
    nature: avertissement
    lexicon_ids: []
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: mediterraneenne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien

sources:
  - type: reference
    titre: "Salmonella spp. — fiche de danger biologique transmissible par les aliments, ANSES (saisine 2016-SA-0080)"
    url: "https://www.anses.fr/system/files/BIORISK2016SA0080Fi.pdf"
    consulte_le: "2026-08-03"
