id: betteraves_roties_balsamique
nom: "Betteraves rôties au vinaigre balsamique"
origine: maison
description: >
  Des betteraves rôties au four avec du thym, puis nappées d'un filet de vinaigre balsamique.
temps_prep_min: 10
temps_cuisson_min: 50
