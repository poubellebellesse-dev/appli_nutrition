    texte: "Enrober les quartiers d'huile d'olive, de thym et de sel, puis enfourner jusqu'à ce qu'ils soient tendres."
    lexicon_ids: [assaisonner, enfourner]
    timer_s: 3000
    timer_type: cuisson
  - ordre: 3
    texte: "Napper d'un filet de vinaigre balsamique à la sortie du four et dresser."
    lexicon_ids: [napper, dresser]
    timer_s: null
    timer_type: null

facettes:
