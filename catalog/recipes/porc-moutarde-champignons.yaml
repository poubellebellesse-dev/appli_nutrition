id: porc_moutarde_champignons
nom: "Filet mignon de porc à la moutarde et aux champignons"
description: >
  Un filet mignon saisi puis mijoté dans une sauce moutarde et crème, avec des champignons.
temps_prep_min: 15
temps_cuisson_min: 35
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
saison_mois: []
envergure: convivial
conservation_jours: 2
axes:
  sucre_sale: -0.4
  leger_consistant: 0.7
  chaud_froid: 0.9
  texture: creme

ingredients:
  - food_id: porc_filet_mignon
    quantite_g: 700
    unite_affichage: "1 filet mignon"
    optionnel: false
  - food_id: champignon_paris
    quantite_g: 400
    unite_affichage: "400 g"
    optionnel: false
  - food_id: moutarde_dijon
    quantite_g: 40
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 150
    unite_affichage: "15 cl"
    optionnel: false
  - food_id: echalote
    quantite_g: 80
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: vin_blanc_cuisine
    quantite_g: 100
    unite_affichage: "10 cl"
    optionnel: true
  - food_id: beurre_doux
    quantite_g: 25
    unite_affichage: "25 g"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer les échalotes et les champignons."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Colorer le filet mignon entier dans le beurre, sur toutes ses faces, puis le réserver."
    lexicon_ids: []
    timer_s: 420
    timer_type: cuisson
  - ordre: 3
    texte: "Faire suer les échalotes, ajouter les champignons et laisser rendre leur eau."
    lexicon_ids: []
    timer_s: 480
    timer_type: cuisson
  - ordre: 4
    texte: "Déglacer au vin blanc, laisser réduire de moitié, puis incorporer la moutarde et la crème."
    lexicon_ids: [deglacer]
    timer_s: 300
    timer_type: cuisson
  - ordre: 5
    texte: "Remettre la viande, saler, couvrir et laisser mijoter à feu doux. Trancher au moment de servir."
    lexicon_ids: []
    timer_s: 1200
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: omnivore
  - facette: style
    valeur: convivial
