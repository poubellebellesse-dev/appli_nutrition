    quantite_g: 330
    unite_affichage: "330 g"
    optionnel: false
  - food_id: pois_chiches
    quantite_g: 300
    unite_affichage: "1 boîte égouttée"
    optionnel: false
  - food_id: courgette
    quantite_g: 400
    unite_affichage: "2 courgettes"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: citron
    quantite_g: 25
    unite_affichage: "1/2 citron"
    optionnel: false
  - food_id: menthe_fraiche
    quantite_g: 10
    unite_affichage: "quelques feuilles"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false
  - food_id: cumin_graine
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false

etapes:
