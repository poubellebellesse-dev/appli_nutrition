    texte: "Couper les courgettes en rondelles épaisses et les enfourner avec l'huile et le cumin."
    lexicon_ids: [enfourner]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Cuire le boulgour à l'eau bouillante salée."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Mélanger le boulgour, les pois chiches et les courgettes rôties."
    lexicon_ids: [rotir]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Arroser de jus de citron et ajouter la menthe ciselée."
    lexicon_ids: [ciseler, arroser]
    timer_s: null
    timer_type: null

facettes:
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: reconfortant
