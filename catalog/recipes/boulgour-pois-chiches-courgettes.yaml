id: boulgour_pois_chiches_courgettes
nom: "Boulgour aux pois chiches et courgettes rôties"
description: >
  Des courgettes rôties au four mêlées au boulgour et aux pois chiches.
temps_prep_min: 15
temps_cuisson_min: 25
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.6
  leger_consistant: 0.5
  chaud_froid: 0.7
  texture: fondant

ingredients:
