id: risotto_asperges_parmesan
nom: "Risotto aux asperges vertes"
origine: maison
description: >
  Un riz crémeux monté au parmesan et au beurre, avec des pointes d'asperges vertes.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 3
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: convivial
conservation_jours: 1
axes:
  sucre_sale: -0.3
  leger_consistant: 0.6
  chaud_froid: 0.9
  texture: creme

ingredients:
  - food_id: riz_blanc
    quantite_g: 320
    unite_affichage: "320 g"
    optionnel: false
  - food_id: asperge_verte
    quantite_g: 500
    unite_affichage: "1 botte"
    optionnel: false
  - food_id: parmesan
    quantite_g: 80
    unite_affichage: "80 g râpé"
    optionnel: false
  - food_id: echalote
    quantite_g: 60
    unite_affichage: "2 échalotes"
    optionnel: false
  - food_id: vin_blanc_cuisine
    quantite_g: 120
    unite_affichage: "12 cl"
    optionnel: false
  - food_id: bouillon_legumes
    quantite_g: 10
    unite_affichage: "1 cube pour 1 litre"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 40
    unite_affichage: "40 g"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Couper les pointes d'asperges et les blanchir trois minutes, réserver. Détailler les tiges en rondelles."
    lexicon_ids: [blanchir, reserver, detailler]
    timer_s: 180
    timer_type: cuisson
  - ordre: 2
    texte: "Maintenir le bouillon frémissant dans une casserole à côté — un bouillon froid stopperait la cuisson à chaque louche."
    lexicon_ids: [fremir]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire suer les échalotes émincées dans l'huile, ajouter le riz et le remuer jusqu'à ce qu'il devienne translucide."
    lexicon_ids: [emincer, suer]
    timer_s: 180
    timer_type: cuisson
  - ordre: 4
    texte: "Déglacer au vin blanc, laisser absorber, puis ajouter le bouillon louche par louche en remuant, avec les rondelles d'asperges."
    lexicon_ids: [deglacer]
    timer_s: 1080
    timer_type: cuisson
  - ordre: 5
    texte: "Hors du feu, incorporer le beurre froid et le parmesan en battant, ajouter les pointes et servir sans attendre."
    lexicon_ids: [incorporer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: convivial
