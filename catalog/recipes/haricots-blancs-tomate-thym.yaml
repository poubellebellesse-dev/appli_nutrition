id: haricots_blancs_tomate_thym
nom: "Haricots blancs à la tomate et au thym"
description: >
  Des haricots blancs mijotés dans une sauce tomate à l'ail, au thym et au laurier.
temps_prep_min: 10
temps_cuisson_min: 35
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.5
  leger_consistant: 0.6
  chaud_froid: 0.8
  texture: fondant

ingredients:
  - food_id: haricot_blanc
    quantite_g: 700
    unite_affichage: "2 conserves égouttées"
    optionnel: false
  - food_id: tomate
    quantite_g: 400
    unite_affichage: "4 tomates"
    optionnel: false
  - food_id: concentre_tomate
    quantite_g: 25
    unite_affichage: "1 cuillère à soupe"
    optionnel: false
  - food_id: oignon
    quantite_g: 120
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: ail
    quantite_g: 12
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: thym_seche
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: laurier
    quantite_g: 1
    unite_affichage: "1 feuille"
    optionnel: true
  - food_id: huile_olive
    quantite_g: 30
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 5
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer les haricots blancs à grande eau et les laisser s'égoutter."
    lexicon_ids: [rincer, egoutter]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer l'oignon et l'ail, les faire fondre dans l'huile sans les colorer."
    lexicon_ids: [emincer]
    timer_s: 420
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter les tomates en dés et le concentré, le thym et le laurier, puis laisser réduire."
    lexicon_ids: [reduire]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Verser les haricots, saler, couvrir à demi et laisser mijoter à feu doux sans remuer trop fort — ils se délitent facilement."
    lexicon_ids: [mijoter]
    timer_s: 1080
    timer_type: cuisson
  - ordre: 5
    texte: "Retirer le laurier et laisser reposer dix minutes hors du feu avant de servir."
    lexicon_ids: []
    timer_s: 600
    timer_type: repos

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
