id: curry_legumes_pois_chiches
nom: "Curry de légumes et pois chiches"
origine: maison
description: >
  Patate douce, chou-fleur et pois chiches mijotés au curry, curcuma et gingembre.
temps_prep_min: 20
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 1
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.2
  leger_consistant: 0.5
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: patate_douce
    quantite_g: 500
    unite_affichage: "2 patates douces"
    optionnel: false
  - food_id: chou_fleur
    quantite_g: 400
    unite_affichage: "1/2 chou-fleur"
    optionnel: false
  - food_id: pois_chiches
    quantite_g: 400
    unite_affichage: "1 conserve égouttée"
    optionnel: false
  - food_id: tomate
    quantite_g: 300
    unite_affichage: "3 tomates"
    optionnel: false
  - food_id: oignon
    quantite_g: 150
    unite_affichage: "1 gros oignon"
    optionnel: false
  - food_id: curry_poudre
    quantite_g: 10
    unite_affichage: "2 cuillères à café"
    optionnel: false
  - food_id: curcuma
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: gingembre_poudre
    quantite_g: 3
    unite_affichage: "1 cuillère à café"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: coriandre_fraiche
    quantite_g: 15
    unite_affichage: "quelques brins"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 6
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Émincer l'oignon, couper la patate douce en cubes et le chou-fleur en petits bouquets."
    lexicon_ids: [emincer, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire revenir l'oignon dans l'huile, puis ajouter curry, curcuma et gingembre et remuer une minute."
    lexicon_ids: [revenir]
    timer_s: 360
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter la patate douce et le chou-fleur, enrober d'épices, puis verser les tomates en dés et un verre d'eau."
    lexicon_ids: [tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Couvrir et laisser mijoter jusqu'à ce que la patate douce s'écrase sous la fourchette."
    lexicon_ids: [mijoter]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 5
    texte: "Ajouter les pois chiches pour les dernières minutes, saler et parsemer de coriandre."
    lexicon_ids: [parsemer]
    timer_s: 420
    timer_type: cuisson

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: indienne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
