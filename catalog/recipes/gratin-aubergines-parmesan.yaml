id: gratin_aubergines_parmesan
nom: "Gratin d'aubergines au parmesan"
origine: maison
description: >
  Des tranches d'aubergine dorées, empilées avec sauce tomate, mozzarella et parmesan.
temps_prep_min: 30
temps_cuisson_min: 45
difficulte: 2
portions_base: 6
image_path: null
types_repas: [dejeuner, diner]
service: plat
saison_mois: []
envergure: convivial
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.6
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: aubergine
    quantite_g: 1000
    unite_affichage: "3 aubergines"
    optionnel: false
  - food_id: tomate
    quantite_g: 600
    unite_affichage: "6 tomates"
    optionnel: false
  - food_id: mozzarella
    quantite_g: 250
    unite_affichage: "2 boules"
    optionnel: false
  - food_id: parmesan
    quantite_g: 80
    unite_affichage: "80 g râpé"
    optionnel: false
  - food_id: basilic_frais
    quantite_g: 25
    unite_affichage: "1 bouquet"
    optionnel: false
  - food_id: ail
    quantite_g: 12
    unite_affichage: "2 gousses"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 70
    unite_affichage: "7 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 8
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Couper les aubergines en tranches d'un centimètre, les saler et les laisser dégorger."
    lexicon_ids: []
    timer_s: 1800
    timer_type: repos
  - ordre: 2
    texte: "Les éponger, puis les faire dorer à la poêle dans l'huile, en plusieurs fois — elles boivent beaucoup."
    lexicon_ids: [dorer, eponger]
    timer_s: 1200
    timer_type: cuisson
  - ordre: 3
    texte: "Préparer une sauce courte avec les tomates en dés et l'ail émincé, jusqu'à ce qu'elle nappe."
    lexicon_ids: [emincer, tailler_des]
    timer_s: 900
    timer_type: cuisson
  - ordre: 4
    texte: "Monter en couches dans un plat : sauce, aubergines, mozzarella en tranches, basilic, parmesan. Répéter."
    lexicon_ids: []
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Terminer par du parmesan et enfourner à 190 °C jusqu'à ce que le dessus soit doré et le gratin bouillonnant."
    lexicon_ids: [dorer, enfourner]
    timer_s: 2700
    timer_type: cuisson

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: convivial
