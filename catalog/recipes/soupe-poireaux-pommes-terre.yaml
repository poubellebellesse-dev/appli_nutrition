id: soupe_poireaux_pommes_terre
nom: "Soupe poireaux-pommes de terre"
origine: maison
description: >
  La soupe la plus simple du répertoire : poireaux et pommes de terre fondus, mixés ou non.
temps_prep_min: 10
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: /catalog/images/soupe-poireaux-pommes-terre.avif
types_repas: [diner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: -0.2
  chaud_froid: 0.9
  texture: liquide

ingredients:
  - food_id: poireau
    quantite_g: 500
    unite_affichage: "3 poireaux"
    optionnel: false
  - food_id: pomme_de_terre
    quantite_g: 500
    unite_affichage: "5 pommes de terre"
    optionnel: false
  - food_id: beurre_doux
    quantite_g: 25
    unite_affichage: "25 g"
    optionnel: false
  - food_id: creme_fraiche
    quantite_g: 60
    unite_affichage: "3 cuillères à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 6
    unite_affichage: "au goût"
    optionnel: false
  - food_id: poivre_noir
    quantite_g: 1
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Émincer les poireaux en rondelles et les rincer à grande eau, le sable se loge entre les feuilles."
    lexicon_ids: [emincer, rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire fondre les poireaux dans le beurre à couvert, sans les colorer."
    lexicon_ids: []
    timer_s: 600
    timer_type: cuisson
  - ordre: 3
    texte: "Ajouter les pommes de terre en cubes, couvrir d'eau à hauteur et saler."
    lexicon_ids: [tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 4
    texte: "Laisser cuire jusqu'à ce que les pommes de terre s'écrasent sans résistance."
    lexicon_ids: []
    timer_s: 1200
    timer_type: cuisson
  - ordre: 5
    texte: "Servir tel quel pour une soupe rustique, ou mixer pour un velouté, puis ajouter la crème."
    lexicon_ids: [mixer]
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: mixeur
    niveau: accelere
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: passoire
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
