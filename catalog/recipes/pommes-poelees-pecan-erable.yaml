id: pommes_poelees_pecan_erable
nom: "Pommes poêlées aux noix de pécan et au sirop d'érable"
origine: maison
description: >
  Des quartiers de pomme dorés à l'huile de coco, arrosés de sirop d'érable et
  de cannelle, servis chauds avec des noix de pécan concassées.
temps_prep_min: 10
temps_cuisson_min: 12
difficulte: 1
portions_base: 4
image_path: null
types_repas: [petit_dejeuner]
service: plat
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: 0.6
  leger_consistant: 0
  chaud_froid: 0.6
  texture: fondant

ingredients:
  - food_id: pomme
    quantite_g: 600
    unite_affichage: "4 pommes"
    optionnel: false
  - food_id: noix_pecan
    quantite_g: 60
    unite_affichage: "60 g"
    optionnel: false
  - food_id: sirop_erable
    quantite_g: 40
    unite_affichage: "3 cuillères à soupe"
    optionnel: false
  - food_id: huile_coco
    quantite_g: 20
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: cannelle
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: true

etapes:
  - ordre: 1
    texte: "Éplucher les pommes et les couper en quartiers."
    lexicon_ids: [eplucher, tailler_des]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Faire fondre l'huile de coco dans une poêle et y saisir les quartiers de pomme."
    lexicon_ids: [saisir]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Laisser dorer en remuant, arroser de sirop d'érable et saupoudrer de cannelle."
    lexicon_ids: [dorer, arroser, saupoudrer]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Servir chaud, parsemé de noix de pécan concassées."
    lexicon_ids: [parsemer]
    timer_s: null
    timer_type: null

facettes:
  - facette: cuisine
    valeur: internationale
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: gourmand
