id: gratin_courgettes_riz
nom: "Gratin de courgettes au riz"
origine: maison
description: >
  Des courgettes râpées mêlées de riz et d'œufs, gratinées à l'emmental.
temps_prep_min: 20
temps_cuisson_min: 45
difficulte: 2
portions_base: 6
image_path: null
types_repas: [diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.6
  chaud_froid: 0.9
  texture: fondant

ingredients:
  - food_id: courgette
    quantite_g: 1000
    unite_affichage: "5 courgettes"
    optionnel: false
  - food_id: riz_blanc
    quantite_g: 150
    unite_affichage: "150 g"
    optionnel: false
  - food_id: oeuf
    quantite_g: 150
    unite_affichage: "3 œufs"
    optionnel: false
  - food_id: fromage_emmental_rape
    quantite_g: 120
    unite_affichage: "120 g"
    optionnel: false
  - food_id: oignon
    quantite_g: 120
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: ail
    quantite_g: 10
    unite_affichage: "2 gousses"
    optionnel: true
  - food_id: huile_olive
    quantite_g: 25
    unite_affichage: "2 cuillères à soupe"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 7
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Cuire le riz à l'eau salée, l'égoutter et le laisser tiédir."
    lexicon_ids: [egoutter]
    timer_s: 900
    timer_type: cuisson
  - ordre: 2
    texte: "Râper les courgettes, les saler et les laisser dégorger dans une passoire, puis les presser fort."
    lexicon_ids: [raper]
    timer_s: 1200
    timer_type: repos
  - ordre: 3
    texte: "Faire revenir l'oignon et l'ail émincés dans l'huile, ajouter les courgettes pressées."
    lexicon_ids: [emincer, revenir]
    timer_s: 600
    timer_type: cuisson
  - ordre: 4
    texte: "Hors du feu, mélanger courgettes, riz, œufs battus et la moitié de l'emmental, rectifier le sel."
    lexicon_ids: [battre]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Verser dans un plat, couvrir du reste de fromage et enfourner à 190 °C jusqu'à ce que le dessus dore."
    lexicon_ids: [enfourner]
    timer_s: 2100
    timer_type: cuisson

equipements:
  - code: four
    niveau: requis
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: passoire
    niveau: informatif
  - code: saladier
    niveau: informatif
  - code: rape
    niveau: informatif
  - code: plat_a_four
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetarien
  - facette: style
    valeur: quotidien
