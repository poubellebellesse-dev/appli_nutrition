id: poelee_sarrasin_legumes_racines
nom: "Poêlée de sarrasin aux légumes racines"
origine: maison
description: >
  Du sarrasin poêlé avec carottes et panais fondants, parfumé au thym.
temps_prep_min: 15
temps_cuisson_min: 30
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: plat
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 3
axes:
  sucre_sale: -0.4
  leger_consistant: 0.5
  chaud_froid: 0.5
  texture: fondant

ingredients:
  - food_id: sarrasin
    quantite_g: 250
    unite_affichage: "250 g"
    optionnel: false
  - food_id: carotte
    quantite_g: 300
    unite_affichage: "3 carottes"
    optionnel: false
  - food_id: panais
    quantite_g: 250
    unite_affichage: "2 panais"
    optionnel: false
  - food_id: oignon
    quantite_g: 100
    unite_affichage: "1 oignon"
    optionnel: false
  - food_id: huile_colza
    quantite_g: 25
    unite_affichage: "2 c. à soupe"
    optionnel: false
  - food_id: thym_seche
    quantite_g: 2
    unite_affichage: "1 pincée"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 pincée"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Éplucher et détailler les carottes et les panais en dés réguliers."
    lexicon_ids: [eplucher, detailler]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Émincer l'oignon."
    lexicon_ids: [emincer]
    timer_s: null
    timer_type: null
  - ordre: 3
    texte: "Faire revenir l'oignon dans l'huile de colza jusqu'à ce qu'il dore légèrement."
    lexicon_ids: [revenir]
    timer_s: 300
    timer_type: cuisson
  - ordre: 4
    texte: "Ajouter les carottes et les panais, saupoudrer de thym et laisser cuire à couvert en remuant régulièrement."
    lexicon_ids: [saupoudrer]
    timer_s: 900
    timer_type: cuisson
  - ordre: 5
    texte: "Ajouter le sarrasin et poursuivre la cuisson jusqu'à ce que les grains soient tendres."
    lexicon_ids: [poeler]
    timer_s: 900
    timer_type: cuisson

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: couteau_chef
    niveau: informatif
  - code: planche_a_decouper
    niveau: informatif
  - code: econome
    niveau: informatif

facettes:
  - facette: cuisine
    valeur: francaise
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
