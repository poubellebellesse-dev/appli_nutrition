# PLAT SIMPLE — une BASE NUE, pas une recette assaisonnée.
#
# `est_plat_simple: true` est un AXE SÉPARÉ de `service` : cette recette EST un accompagnement,
# elle en porte le rang, mais elle ne fait pas un repas à elle seule. Le moteur l'écarte de la
# passe de pis-aller de `pickForSlot` et de « Changer » — voir catalog/build.mjs (bloc
# « Plats simples ») et docs/CONCEPTION_RETOURS_TEST.md, lot retour-5.
#
# AU PLUS 3 INGRÉDIENTS, refusé au build au-delà : « nature » est une forme, pas une intention.
# L'eau n'est pas un aliment du catalogue (convention du poids sec), elle ne se déclare pas.
id: riz_complet_nature
nom: "Riz complet nature"
origine: maison
description: >
  Du riz complet cuit à l'eau salée. Il demande le double du temps du riz blanc et garde du mordant.
temps_prep_min: 2
temps_cuisson_min: 40
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
est_plat_simple: true
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.5
  leger_consistant: 0.3
  chaud_froid: 0.9
  texture: ferme

ingredients:
  - food_id: riz_complet
    quantite_g: 300
    unite_affichage: "300 g de riz complet"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer le riz complet à l'eau froide."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Le cuire dans un grand volume d'eau salée bouillante : le grain doit rester ferme sous la dent."
    lexicon_ids: [fremir]
    timer_s: 2400
    timer_type: cuisson
  - ordre: 3
    texte: "Égoutter à fond, sans rincer."
    lexicon_ids: [egoutter]
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: casserole
    niveau: informatif
  - code: passoire
    niveau: informatif

facettes:
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
