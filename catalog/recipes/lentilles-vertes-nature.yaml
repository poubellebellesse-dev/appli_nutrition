# PLAT SIMPLE — une BASE NUE, pas une recette assaisonnée.
#
# `est_plat_simple: true` est un AXE SÉPARÉ de `service` : cette recette EST un accompagnement,
# elle en porte le rang, mais elle ne fait pas un repas à elle seule. Le moteur l'écarte de la
# passe de pis-aller de `pickForSlot` et de « Changer » — voir catalog/build.mjs (bloc
# « Plats simples ») et docs/CONCEPTION_RETOURS_TEST.md, lot retour-5.
#
# AU PLUS 3 INGRÉDIENTS, refusé au build au-delà : « nature » est une forme, pas une intention.
# L'eau n'est pas un aliment du catalogue (convention du poids sec), elle ne se déclare pas.
id: lentilles_vertes_nature
nom: "Lentilles vertes nature"
origine: maison
description: >
  Des lentilles vertes cuites à l'eau, salées seulement en fin de cuisson pour qu'elles ne durcissent pas.
temps_prep_min: 2
temps_cuisson_min: 25
difficulte: 1
portions_base: 4
image_path: null
types_repas: [dejeuner, diner]
service: accompagnement
est_plat_simple: true
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 2
axes:
  sucre_sale: -0.5
  leger_consistant: 0.4
  chaud_froid: 0.8
  texture: ferme

ingredients:
  - food_id: lentilles_vertes
    quantite_g: 300
    unite_affichage: "300 g de lentilles vertes"
    optionnel: false
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "1 cuillère à café"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Rincer les lentilles et retirer les éventuels petits cailloux."
    lexicon_ids: [rincer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les couvrir de trois fois leur volume d'eau froide et non salée, puis porter à frémissement."
    lexicon_ids: [fremir]
    timer_s: 1500
    timer_type: cuisson
  - ordre: 3
    texte: "Saler en toute fin de cuisson, puis égoutter : salées trop tôt, elles restent dures."
    lexicon_ids: [egoutter]
    timer_s: null
    timer_type: null

equipements:
  - code: plaque_cuisson
    niveau: requis
  - code: casserole
    niveau: informatif
  - code: passoire
    niveau: informatif

facettes:
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
