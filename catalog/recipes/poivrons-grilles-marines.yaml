id: poivrons_grilles_marines
nom: "Poivrons grillés marinés à l'ail"
origine: maison
description: >
  Des poivrons rôtis au four, pelés puis marinés dans l'huile d'olive avec ail et basilic.
temps_prep_min: 20
temps_cuisson_min: 35
difficulte: 2
portions_base: 4
image_path: null
types_repas: [dejeuner]
service: entree
piquant: 0
saison_mois: []
envergure: quotidien
conservation_jours: 4
axes:
  sucre_sale: -0.2
  leger_consistant: -0.6
  chaud_froid: -0.4
  texture: fondant

ingredients:
  - food_id: poivron_rouge
    quantite_g: 600
    unite_affichage: "3 poivrons rouges"
    optionnel: false
  - food_id: poivron_vert
    quantite_g: 300
    unite_affichage: "2 poivrons verts"
    optionnel: true
  - food_id: ail
    quantite_g: 15
    unite_affichage: "3 gousses"
    optionnel: false
  - food_id: basilic_frais
    quantite_g: 15
    unite_affichage: "quelques feuilles"
    optionnel: false
  - food_id: huile_olive
    quantite_g: 60
    unite_affichage: "6 cuillères à soupe"
    optionnel: false
  - food_id: vinaigre_vin_rouge
    quantite_g: 15
    unite_affichage: "1 cuillère à soupe"
    optionnel: true
  - food_id: sel_fin
    quantite_g: 4
    unite_affichage: "au goût"
    optionnel: false

etapes:
  - ordre: 1
    texte: "Préchauffer le four à 220 °C et poser les poivrons entiers sur une plaque."
    lexicon_ids: [prechauffer]
    timer_s: null
    timer_type: null
  - ordre: 2
    texte: "Les rôtir en les retournant, jusqu'à ce que la peau noircisse et cloque de tous côtés."
    lexicon_ids: [rotir]
    timer_s: 2100
    timer_type: cuisson
  - ordre: 3
    texte: "Les enfermer chauds dans un saladier couvert : la vapeur décolle la peau toute seule."
    lexicon_ids: []
    timer_s: 900
    timer_type: repos
  - ordre: 4
    texte: "Les peler à la main, retirer graines et pédoncule, puis les détailler en lanières. Ne pas les rincer, on perdrait le jus."
    lexicon_ids: [eplucher, rincer, detailler]
    timer_s: null
    timer_type: null
  - ordre: 5
    texte: "Mariner avec l'ail émincé, l'huile, le vinaigre, le sel et le basilic ; c'est meilleur le lendemain."
    lexicon_ids: [emincer, mariner]
    timer_s: 7200
    timer_type: repos

facettes:
  - facette: cuisine
    valeur: italienne
  - facette: regime
    valeur: vegetalien
  - facette: style
    valeur: quotidien
