# ============================================================================
# Appariement aliment du catalogue → code Ciqual (ANSES, table 2025).
#
# ÉCRIT ET RELU À LA MAIN. Ne jamais générer ce fichier automatiquement : Ciqual
# nomme ses 3 484 entrées de façon très fine et un rapprochement par similarité
# de nom choisit silencieusement la mauvaise ligne. Exemple vécu : une recherche
# « saumon » remonte d'abord « Rillettes de saumon », « Huile de saumon » et
# « Saumon fumé » avant « Saumon, élevage, cru ». Une valeur nutritionnelle
# fausse ne se voit pas — elle se propage dans tout le moteur.
#
# Construire une ligne : node catalog/import-ciqual.mjs --search "<terme>"
# Vérifier l'ensemble : node catalog/import-ciqual.mjs --check
#
# CONVENTIONS DE CHOIX
#  - Aliment CRU quand notre catalogue décrit un ingrédient cru : les recettes
#    donnent des quantités d'ingrédients avant cuisson.
#  - « aliment moyen » quand Ciqual n'a que des variétés et que notre entrée est
#    générique (tomate, raisin) — c'est exactement ce pour quoi l'ANSES publie
#    ces agrégats.
#  - Jamais un produit transformé, préemballé ou cuisiné pour un ingrédient de
#    base.
#
# ÉCARTS ASSUMÉS, à relire si la nutrition d'une recette semble fausse :
#  - `lentilles_corail` et `lentilles_vertes` pointent tous deux sur 20359
#    (« Lentille, sèche », aliment moyen) : Ciqual ne distingue pas les variétés
#    de lentille sèche. Les deux aliments auront donc des valeurs identiques.
#  - `poulet_blanc` → 36007 « Poulet blanc, viande ET PEAU crues » : Ciqual n'a
#    pas de blanc sans peau cru. Les lipides sont donc légèrement surestimés.
#  - `cognac` → 1001 « Eau de vie de fruits » : le cognac est absent de Ciqual.
#  - `comte_rape` → 12110 « Comté » : pas de variante râpée (sans effet, le
#    râpage ne change pas la composition pour 100 g).
#  - `amande_effilee` → 15041 « Amande, émondée » : l'effilage n'est pas une
#    variante Ciqual, l'amande émondée est la plus proche.
# ============================================================================

