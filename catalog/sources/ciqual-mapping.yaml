  #     du catalogue sur le code de `pates_spaghetti` et de `riz_blanc` — un doublon déguisé.
  #
  # ⚠️ `cerise` = 13008, dont Ciqual écrit le nom « Ceriser » (coquille de la table source). Les
  #   trois autres résultats d'une recherche « cerise » sont de l'ACÉROLA, un fruit sans rapport
  #   (13055, 13404) ou un jus (2040). Exactement le piège décrit en tête de ce fichier.
  #
  # ⚠️ `creme_liquide` = 19417 et `creme_fraiche` = 19410 : même taux (30 % MG), textures
  #   différentes (fluide UHT / épaisse rayon frais). Deux produits, deux comportements en cuisson.

