  # ==========================================================================
  # Lot d'élargissement (2026-08-04). 56 aliments, tirés uniquement de Ciqual — aucune seconde
  # table. Voir la note en tête de ce fichier : mélanger USDA ou CoFID rouvrirait les valeurs
  # « PROV-000xx, ordres de grandeur usuels, PAS vérifiées » que le projet a payé pour supprimer,
  # et `--check` traite un aliment sans code Ciqual comme une ERREUR, pas un avertissement.
