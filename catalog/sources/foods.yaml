# ============================================================================
# Aliments du catalogue — valeurs nutritionnelles CIQUAL 2025 (ANSES).
#
# ⚠️ `code_ciqual` et les blocs `nutriments` sont GÉNÉRÉS. Ne pas les éditer à
# la main : `node catalog/import-ciqual.mjs --write` les réécrit depuis l'export
# XML de l'ANSES et écrasera toute retouche. L'appariement aliment → code CIQUAL
# vit dans catalog/sources/ciqual-mapping.yaml, écrit et relu à la main (les
# écarts assumés y sont documentés aliment par aliment).
#
# Tout le reste — id, nom, groupe, saison_mois, toute_annee, allergenes, et les
# commentaires éditoriaux de saisonnalité ci-dessous — est écrit et maintenu à
# la main : CIQUAL ne porte ni saisonnalité locale ni allergènes.
#
# Les 9 nutriments retenus (décision 25, docs/ETAT.md §4), pour 100 g de partie
# comestible : énergie · protéines · lipides · glucides · fibres · fer ·
# calcium · sodium · vitamine C. Un nutriment NON DÉTERMINÉ par CIQUAL est
# ABSENT de la liste, jamais mis à 0 — un zéro inventé serait indistinguable
# d'un vrai zéro pour la couche `nutri`. Trois aliments sont dans ce cas pour la
# vitamine C (poulet, comté, truite).
#
# Source : Table de composition nutritionnelle des aliments CIQUAL 2025, ANSES,
# novembre 2025. https://ciqual.anses.fr/ — https://doi.org/10.57745/RDMHWY
# La table source (69 Mo) n'est PAS versionnée : voir l'en-tête de
# catalog/import-ciqual.mjs pour la récupérer.
#
# Allergènes : parmi les 14 allergènes réglementaires UE (règlement
# 1169/2011 annexe II). Codes utilisés ici : gluten, crustaces, oeufs,
# poissons, arachides, soja, lait, fruits_a_coque, celeri, moutarde,
# sesame, sulfites, lupin, mollusques.
# certitude ∈ { contient, traces }
#
# Saisonnalité (P1b-1, docs/ARCHITECTURE.md §4.2, docs/ENGINE.md §6.5
# précision 3) : `toute_annee` et `saison_mois` sont DEUX DIMENSIONS
# INDÉPENDANTES, pas un choix exclusif.
#   - `toute_annee: true` dit la DISPONIBILITÉ : rayon, conservation longue,
#     épicerie sèche, produit animal d'élevage, import permanent.
#   - `saison_mois` liste les mois de PLEINE SAISON : le goût, la production
#     LOCALE en France métropolitaine (jamais une disponibilité par import).
# Un légume ou fruit de garde (carotte, oignon, pomme de terre, pomme…) porte
# légitimement les deux à la fois : disponible toute l'année ET de pleine
# saison sur une fenêtre de mois donnée — le build accepte ce double
# marquage. Un aliment SANS `saison_mois` est un staple au sens de
# docs/ENGINE.md §6.5 précision 3 : il est exclu du calcul de la couche
# `season` (engine/selection/scoring/season.ts) pour qu'un plat de pâtes ne
# se fasse pas passer pour un plat de saison. Ni `saison_mois` ni
# `toute_annee` renseignés n'est pas une erreur : c'est un aliment neutre
# (saisonnalité non renseignée).
# ============================================================================

