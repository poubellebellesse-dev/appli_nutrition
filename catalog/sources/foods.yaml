# ============================================================================
# PROVISOIRE — sous-ensemble d'aliments pour amorcer la chaîne de build (P0).
#
# Il n'existe pas encore de table CIQUAL (ANSES) téléchargée dans ce dépôt.
# Les valeurs nutritionnelles ci-dessous sont des ordres de grandeur usuels
# (pour 100 g de partie comestible), PAS des valeurs vérifiées contre la
# table CIQUAL officielle. Les `code_ciqual` sont des identifiants
# provisoires (préfixe PROV-), pas de vrais codes CIQUAL.
#
# Le vrai import ira dans catalog/sources/ciqual/ (fichier ANSES en clair,
# licence ouverte — voir docs/ARCHITECTURE.md §8.1) et remplacera ce
# fichier ; le reste de la chaîne (build.mjs, schéma food/food_nutrient/
# food_allergen) n'aura pas à changer.
#
# Allergènes : parmi les 14 allergènes réglementaires UE (règlement
# 1169/2011 annexe II). Codes utilisés ici : gluten, crustaces, oeufs,
# poissons, arachides, soja, lait, fruits_a_coque, celeri, moutarde,
# sesame, sulfites, lupin, mollusques.
# certitude ∈ { contient, traces }
#
# Saisonnalité (P1b-1, docs/ARCHITECTURE.md §4.2, docs/ENGINE.md §6.5
# précision 3) : `toute_annee` et `saison_mois` sont DEUX DIMENSIONS
# INDÉPENDANTES, pas un choix exclusif.
#   - `toute_annee: true` dit la DISPONIBILITÉ : rayon, conservation longue,
#     épicerie sèche, produit animal d'élevage, import permanent.
#   - `saison_mois` liste les mois de PLEINE SAISON : le goût, la production
#     LOCALE en France métropolitaine (jamais une disponibilité par import).
# Un légume ou fruit de garde (carotte, oignon, pomme de terre, pomme…) porte
# légitimement les deux à la fois : disponible toute l'année ET de pleine
# saison sur une fenêtre de mois donnée — le build accepte ce double
# marquage. Un aliment SANS `saison_mois` est un staple au sens de
# docs/ENGINE.md §6.5 précision 3 : il est exclu du calcul de la couche
# `season` (engine/selection/scoring/season.ts) pour qu'un plat de pâtes ne
# se fasse pas passer pour un plat de saison. Ni `saison_mois` ni
# `toute_annee` renseignés n'est pas une erreur : c'est un aliment neutre
# (saisonnalité non renseignée).
# ============================================================================

